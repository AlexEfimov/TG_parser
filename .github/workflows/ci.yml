name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: tg_parser_test
          POSTGRES_USER: tg_parser_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    strategy:
      matrix:
        python-version: ['3.12']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      
      - name: Enable pgvector extension
        run: |
          PGPASSWORD=test_password psql -h localhost -U tg_parser_test -d tg_parser_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run linting (ruff)
        run: |
          ruff check . --output-format=github
      
      - name: Run formatting check (ruff)
        run: |
          ruff format --check .
      
      - name: Run tests
        run: |
          pytest --tb=short -v --cov=tg_parser --cov-report=xml --cov-report=term
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: tg_parser_test
          DB_USER: tg_parser_test
          DB_PASSWORD: test_password
          # Mock API keys for tests
          OPENAI_API_KEY: sk-test-key
          ANTHROPIC_API_KEY: sk-ant-test-key
          GEMINI_API_KEY: test-key
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: tg_parser:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test Docker image
        run: |
          docker run --rm tg_parser:test --help
          docker run --rm tg_parser:test init --help

  lint-docs:
    name: Lint Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check Markdown files
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          config-file: '.github/workflows/markdown-link-check-config.json'
          use-quiet-mode: 'yes'

  alembic-guardrail:
    name: Alembic Guardrails
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: tg_parser_alembic
          POSTGRES_USER: tg_parser_alembic
          POSTGRES_PASSWORD: alembic_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: tg_parser_alembic
      DB_USER: tg_parser_alembic
      DB_PASSWORD: alembic_password
      OPENAI_API_KEY: sk-test
      ANTHROPIC_API_KEY: sk-ant-test
      GEMINI_API_KEY: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=alembic_password psql -h localhost -U tg_parser_alembic -d tg_parser_alembic -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Single head per database
        run: |
          set -e
          for db in ingestion raw processing; do
            echo "--- heads check: $db ---"
            heads_output=$(tg-parser db heads --db "$db")
            echo "$heads_output"
            head_count=$(echo "$heads_output" | grep -cE "^[a-f0-9]+ \(head\)" || true)
            if [ "$head_count" -ne 1 ]; then
              echo "ERROR: db $db reports $head_count heads, expected exactly 1"
              echo "Likely cause: duplicate revision id or branched migration chain (see DEV_RESURRECTION runbook FAQ)."
              exit 1
            fi
            echo "OK: $db has 1 head"
          done

      - name: Smoke upgrade head -> downgrade base -> upgrade head
        run: |
          set -e
          for db in ingestion raw processing; do
            echo "--- upgrade $db -> head ---"
            tg-parser db upgrade --db "$db"
          done
          for db in ingestion raw processing; do
            echo "--- downgrade $db -> base ---"
            # `tg-parser db downgrade` uses typer.confirm; pipe `yes` to bypass interactive prompt
            yes y | tg-parser db downgrade --db "$db" base
          done
          for db in ingestion raw processing; do
            echo "--- re-upgrade $db -> head ---"
            tg-parser db upgrade --db "$db"
          done

      - name: Alembic check (model vs migration drift; advisory)
        # NOTE: target_metadata=None in migrations/env.py — drift check is no-op until DI-1 lands.
        # Kept as informational step; flip to failing once target_metadata is wired.
        run: |
          for db in ingestion raw processing; do
            echo "--- check $db ---"
            tg-parser db check --db "$db" || echo "(advisory only — DI-1 follow-up)"
          done

