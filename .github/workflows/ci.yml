name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # BUG-059: nightly run for the cost-controlled compose integration job.
    - cron: '0 3 * * *'

jobs:
  deps-lock-guard:
    # #295 Phase 2: resolution-time guard (complements the Phase-1 runtime
    # metrics test). Fails the PR if pyproject.toml was bumped without
    # re-locking, if the generated requirements.txt drifted from the lock, or
    # if the lock can no longer resolve cleanly.
    name: Dependency Lock Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.10.0"
          enable-cache: true
      - name: Lock is in sync with pyproject
        run: uv lock --check
      - name: requirements.txt matches the lock
        run: |
          # Export straight to requirements.txt so uv's own header records a
          # stable "-o requirements.txt" path, then prepend the banner via a
          # differently-named intermediate (which never appears in the header).
          uv export --frozen --no-dev --no-emit-project \
            --format requirements-txt -o requirements.txt
          {
            printf "# AUTO-GENERATED from uv.lock by 'uv export' — DO NOT EDIT BY HAND.\n"
            printf "# Regenerate: uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements.txt\n"
            cat requirements.txt
          } > requirements.txt.banner
          mv requirements.txt.banner requirements.txt
          git diff --exit-code -- requirements.txt
      - name: Clean resolve from lock (no resolver freedom)
        run: uv sync --frozen --no-dev --no-install-project

  # F9 Phase 3 S1 — report-only vulnerability scan against the lock export.
  # Non-blocking: findings are visible in CI but do not gate merge (ADR 0017:
  # no Dependabot/Renovate PR spam; manual freshness).
  pip-audit:
    name: pip-audit (report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.10.0"
          enable-cache: true
      - name: Export lock and run pip-audit
        run: |
          uv export --frozen --no-dev --no-emit-project \
            --format requirements-txt -o /tmp/reqs-audit.txt
          uvx pip-audit -r /tmp/reqs-audit.txt || true

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: tg_parser_test
          POSTGRES_USER: tg_parser_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    strategy:
      matrix:
        python-version: ['3.12']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Install dependencies (uv sync from lock)
        run: uv sync --frozen --extra dev

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=test_password psql -h localhost -U tg_parser_test -d tg_parser_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run linting (ruff)
        run: uv run ruff check . --output-format=github
      
      - name: Run formatting check (ruff)
        run: uv run ruff format --check .
      
      - name: Run tests
        run: |
          uv run pytest --tb=short -v --cov=tg_parser --cov-report=xml --cov-report=term
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: tg_parser_test
          DB_USER: tg_parser_test
          DB_PASSWORD: test_password
          # Mock API keys for tests
          OPENAI_API_KEY: sk-test-key
          ANTHROPIC_API_KEY: sk-ant-test-key
          GEMINI_API_KEY: test-key
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: tg_parser:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test Docker image
        run: |
          docker run --rm tg_parser:test --help
          docker run --rm tg_parser:test init --help

  compose-integration:
    # BUG-059: docker-compose harness asserting the MCP→tg_parser cross-container
    # pipeline dispatch (ADR 0007 Option B). Cost-controlled: runs only on
    # main-push and the nightly schedule, NOT on every PR.
    name: Compose Integration (MCP dispatch)
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Install dependencies (uv sync from lock)
        run: uv sync --frozen --extra dev

      - name: Write compose .env (dummy secrets)
        run: |
          cat > .env <<'EOF'
          DB_NAME=tg_parser
          DB_USER=tg_parser_user
          DB_PASSWORD=compose_test_password
          API_PORT=8000
          MCP_PORT=8080
          LLM_PROVIDER=openai
          OPENAI_API_KEY=sk-test-key
          ANTHROPIC_API_KEY=sk-ant-test-key
          GEMINI_API_KEY=test-key
          TELEGRAM_API_ID=12345
          TELEGRAM_API_HASH=test_hash
          TELEGRAM_PHONE=+10000000000
          MCP_AUTH_ENABLED=false
          LOG_FORMAT=json
          LOG_LEVEL=INFO
          EOF

      - name: Create external postgres volume
        run: docker volume create tg_parser_pgvector17_data

      - name: Bring up compose stack (postgres, tg_parser, mcp)
        run: |
          docker compose up -d --build postgres tg_parser mcp

      - name: Enable pgvector extension
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U tg_parser_user -d tg_parser; then
              break
            fi
            sleep 2
          done
          docker compose exec -T postgres psql -U tg_parser_user -d tg_parser -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run alembic migrations inside container
        run: |
          for db in ingestion raw processing; do
            docker compose exec -T tg_parser tg-parser db upgrade --db "$db"
          done

      - name: Wait for tg_parser + mcp health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health && curl -fsS http://127.0.0.1:8080/health; then
              echo "stack healthy"; break
            fi
            sleep 3
          done

      - name: Run compose integration tests
        env:
          COMPOSE_INTEGRATION: '1'
          # Host-side DB connection for the test's source-seeding helper.
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          COMPOSE_DB_NAME: tg_parser
          DB_USER: tg_parser_user
          DB_PASSWORD: compose_test_password
          OPENAI_API_KEY: sk-test-key
          ANTHROPIC_API_KEY: sk-ant-test-key
          GEMINI_API_KEY: test-key
        run: |
          uv run pytest -v --tb=short -m "integration and compose_only" \
            tests/test_compose_pipeline_dispatch_integration.py

      - name: Dump tg_parser logs on failure
        if: failure()
        run: docker compose logs tg_parser mcp postgres

      - name: Tear down stack
        if: always()
        run: docker compose down -v

  lint-docs:
    name: Lint Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check Markdown files
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          config-file: '.github/workflows/markdown-link-check-config.json'
          use-quiet-mode: 'yes'

  promtool:
    # BUG-089 aftermath: a rule that queries a non-existent series is
    # syntactically valid, so nothing in CI could tell a working alert from a
    # dead one — the alerts and their unit tests were validated by hand or not
    # at all. This job makes both automatic on every PR.
    name: Prometheus Rules (promtool)
    runs-on: ubuntu-latest

    env:
      # Keep in step with the prom/prometheus tag in docker-compose.yml: the
      # validator should be the same evaluator production runs, or CI can bless
      # syntax the live Prometheus rejects.
      PROMTOOL_VERSION: '3.13.2'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install promtool
        run: |
          set -euo pipefail
          tarball="prometheus-${PROMTOOL_VERSION}.linux-amd64"
          curl -fsSL -o /tmp/prom.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMTOOL_VERSION}/${tarball}.tar.gz"
          tar -xzf /tmp/prom.tar.gz -C /tmp "${tarball}/promtool"
          sudo install -m 0755 "/tmp/${tarball}/promtool" /usr/local/bin/promtool
          promtool --version

      - name: Validate alert rules
        run: promtool check rules docker/prometheus/alerts.yml

      - name: Validate scrape config
        run: |
          set -euo pipefail
          # prometheus.yml references rule_files at /etc/prometheus/conf/alerts.yml,
          # which is the in-container path of the ./docker/prometheus bind mount
          # (BUG-090 made that mount a directory). Reproduce the mount rather than
          # softening the config, so CI checks the file exactly as the container
          # resolves it.
          sudo mkdir -p /etc/prometheus
          sudo ln -sfn "$PWD/docker/prometheus" /etc/prometheus/conf
          promtool check config docker/prometheus/prometheus.yml

      - name: Run alert rule unit tests
        # alerts_test.yml resolves rule_files relative to its own location.
        working-directory: docker/prometheus
        run: promtool test rules alerts_test.yml

  alembic-guardrail:
    name: Alembic Guardrails
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: tg_parser_alembic
          POSTGRES_USER: tg_parser_alembic
          POSTGRES_PASSWORD: alembic_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: tg_parser_alembic
      DB_USER: tg_parser_alembic
      DB_PASSWORD: alembic_password
      OPENAI_API_KEY: sk-test
      ANTHROPIC_API_KEY: sk-ant-test
      GEMINI_API_KEY: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Install dependencies (uv sync from lock)
        run: uv sync --frozen --extra dev

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=alembic_password psql -h localhost -U tg_parser_alembic -d tg_parser_alembic -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Single head per database
        run: |
          set -e
          for db in ingestion raw processing; do
            echo "--- heads check: $db ---"
            heads_output=$(uv run tg-parser db heads --db "$db")
            echo "$heads_output"
            head_count=$(echo "$heads_output" | grep -cE "^[a-f0-9]+ \(head\)" || true)
            if [ "$head_count" -ne 1 ]; then
              echo "ERROR: db $db reports $head_count heads, expected exactly 1"
              echo "Likely cause: duplicate revision id or branched migration chain (see DEV_RESURRECTION runbook FAQ)."
              exit 1
            fi
            echo "OK: $db has 1 head"
          done

      - name: Smoke upgrade head -> downgrade base -> upgrade head
        run: |
          set -e
          for db in ingestion raw processing; do
            echo "--- upgrade $db -> head ---"
            uv run tg-parser db upgrade --db "$db"
          done
          for db in ingestion raw processing; do
            echo "--- downgrade $db -> base ---"
            # DI-14 FIXED: --yes/-y bypasses typer.confirm() in non-tty contexts
            uv run tg-parser db downgrade --db "$db" --yes base
          done
          for db in ingestion raw processing; do
            echo "--- re-upgrade $db -> head ---"
            uv run tg-parser db upgrade --db "$db"
          done

      - name: Alembic check (model vs migration drift)
        run: |
          set -e
          for db in ingestion raw processing; do
            echo "--- check $db ---"
            uv run tg-parser db check --db "$db"
          done

  alembic-runtime-smoke:
    # Sprint A.6 / DI-9 phase 2 — runtime guardrail.
    # Renamed from ``alembic-parity`` in Sprint A.7 / DI-19: the parity
    # proof against the legacy ``init_*_schema()`` helpers retired with
    # the helpers themselves (alembic is now the sole source of truth),
    # so this job now only runs the testcontainers-based runtime
    # upgrade smoke — for each logical DB branch it spins a clean
    # pgvector:pg17 container, runs ``alembic upgrade head``, and
    # asserts the expected tables + critical indexes exist at runtime
    # (mirror of the static AST guardrail).
    # GitHub-hosted ubuntu-latest runners ship Docker, which is all
    # testcontainers-python needs.  The tests are opt-in via
    # ``TEST_TESTCONTAINERS=1`` so they stay skipped in the regular
    # ``test`` job above (which already has its own PG service).
    name: Alembic Runtime Upgrade Smoke (testcontainers)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Install dependencies (uv sync from lock)
        run: uv sync --frozen --extra dev

      - name: Verify Docker daemon
        run: |
          docker version
          docker info --format '{{.ServerVersion}}'

      - name: Runtime upgrade smoke
        env:
          TEST_TESTCONTAINERS: '1'
          # Mock keys so module import doesn't trip on Settings validation.
          OPENAI_API_KEY: sk-test
          ANTHROPIC_API_KEY: sk-ant-test
          GEMINI_API_KEY: test
        run: |
          uv run pytest -v --tb=short \
            tests/test_migrations_runtime_upgrade.py \
            tests/test_ingestion_state_repo_soft_delete.py

