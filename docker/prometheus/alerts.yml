groups:
  - name: tg_parser_alerts
    rules:
      # High HTTP error rate (>10% of requests returning 5xx over 5 min)
      - alert: HighHTTPErrorRate
        expr: >
          sum(rate(tg_parser_http_requests_total{status=~"5.."}[5m]))
          /
          sum(rate(tg_parser_http_requests_total[5m]))
          > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP 5xx error rate (>10%)"
          description: "{{ $value | humanizePercentage }} of HTTP requests are failing."

      # LLM error rate (>20% over 5 min)
      - alert: HighLLMErrorRate
        expr: >
          sum(rate(tg_parser_llm_requests_total{status="error"}[5m]))
          /
          sum(rate(tg_parser_llm_requests_total[5m]))
          > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High LLM error rate (>20%)"
          description: "{{ $value | humanizePercentage }} of LLM requests are failing."

      # LLM latency P95 > 30s over 5 min
      - alert: HighLLMLatency
        expr: >
          histogram_quantile(0.95,
            sum(rate(tg_parser_llm_request_duration_seconds_bucket[5m])) by (le)
          ) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "LLM P95 latency > 30s"
          description: "P95 LLM request duration is {{ $value | humanizeDuration }}."

      # DB connections near pool limit (>80% utilization)
      - alert: DBPoolNearLimit
        expr: >
          tg_parser_db_connections_active
          > 12
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "DB pool connections high (>12 active)"
          description: "Database {{ $labels.database }} has {{ $value }} active connections."

      # API service down (no scrape for 2 min)
      - alert: APIServiceDown
        expr: up{job="tg_parser_api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "TG_parser API is down"
          description: "API service has been unreachable for 2+ minutes."

      # MCP service down
      - alert: MCPServiceDown
        expr: up{job="tg_parser_mcp"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "TG_parser MCP server is down"
          description: "MCP service has been unreachable for 2+ minutes."

      # No messages processed in 1 hour (during working hours — optional)
      - alert: NoMessagesProcessed
        expr: >
          increase(tg_parser_messages_processed_total[1h]) == 0
          and
          sum(tg_parser_messages_processed_total) > 0
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "No messages processed in the last hour"
          description: "Pipeline may be stalled or idle."

      # BUG-060 (deferred "full" follow-up) — F11 watchlist push-delivery error
      # tripwire. Provisions the operator tripwire already documented in
      # docs/runbooks/F5C_DEPLOY_AND_WATCH.md § "F11 watchlist health":
      #   rate(tg_watchlist_delivery_total{outcome="error"}[5m]) > 0.1
      #
      # WHY DELIVERY, NOT SCORE (BUG-060 gate):
      # This rule deliberately targets the DELIVERY metric, NOT the
      # tg_watchlist_score histogram. Per BUG-060 / ADR-0010-0011, the score
      # blend mixes keyword-only rows (combined=1.0, semantic=0.0 when
      # semantic_available=False — by design) with hybrid rows, and
      # tg_watchlist_score is registered WITHOUT any semantic_available label
      # (see tg_parser/api/metrics.py WATCHLIST_SCORE), so a blended-formula
      # score-threshold alert cannot be gated on semantic_available and would
      # false-fire on keyword-only rows. tg_watchlist_delivery_total{outcome}
      # is independent of the score blend, so this rule is BUG-060-safe by
      # construction. A gated score alert remains deferred — it requires adding
      # a semantic_available label to the histogram (a metric/scoring-path
      # change), which is out of scope here. See also the guide comment in
      # docker/grafana/provisioning/alerting/wave1_step4.yaml.
      #
      # Threshold 0.1 errs/s + for:10m: matches the documented tripwire and
      # requires the errors to persist across ~two 5m windows so a single
      # transient Telegram rate-limit burst does not page. outcome="error" is
      # transient failures only; outcome="blocked" auto-soft-deletes the
      # interest and is intentionally excluded.
      - alert: WatchlistDeliveryErrors
        expr: >
          sum(rate(tg_watchlist_delivery_total{outcome="error"}[5m]))
          > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "F11 watchlist push-delivery error rate high (>0.1/s)"
          description: "Transient watchlist delivery failures (Telegram rate-limit / network) sustained for 10m at {{ $value }} errors/s — check bot token / network."

      # D1 / Wave-2 T6 — keyword-only (semantic-unavailable) share tripwire.
      #
      # WHY A DEDICATED reason-GATED COUNTER, NOT tg_watchlist_score (T6 gate):
      # Mirrors the BUG-060 reasoning above. tg_watchlist_score is registered
      # WITHOUT a semantic_available label (see tg_parser/api/metrics.py
      # WATCHLIST_SCORE), so it blends keyword-only rows (combined=1.0,
      # semantic=0.0 when semantic_available=False — by design per ADR-0010/0011)
      # with hybrid rows and CANNOT be gated on semantic_available. This rule
      # instead targets tg_watchlist_semantic_unavailable_total{reason}, a
      # dedicated low-cardinality counter incremented in compute_watch_score's
      # semantic_available=False branch (PLAN_WAVE2 §4a option B — chosen over
      # relabelling the histogram to avoid score-bucket × semantic_available
      # cardinality inflation). The ratio is the keyword-only SHARE of all
      # scored matches: tg_watchlist_semantic_unavailable_total over
      # tg_watchlist_matches_total (= every record_watchlist_match candidate).
      #
      # Threshold >0.5 over [1h] + for:6h: CONSERVATIVE. A sustained majority
      # of matches scoring keyword-only signals a systemic embedding gap
      # (interest backfill stalled or doc-embedding pipeline degraded), not a
      # one-off. The long [1h] rate window + 6h for: debounce keeps this from
      # paging on transient backfill catch-up or low-volume noise. severity
      # warning (operator-actionable: backfill interest/doc embeddings), iterate
      # on the threshold once D1 data lands. This is OBSERVABILITY only — the
      # scoring formula (D2) is intentionally unchanged this sprint.
      - alert: WatchlistSemanticUnavailableHigh
        expr: >
          sum(rate(tg_watchlist_semantic_unavailable_total[1h]))
          /
          sum(rate(tg_watchlist_matches_total[1h]))
          > 0.5
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "F11 watchlist keyword-only (semantic-unavailable) share >50%"
          description: "{{ $value | humanizePercentage }} of scored watchlist matches degraded to keyword-only (no semantic signal) over 1h — interest or document embeddings are likely missing; check the embedding backfill. Distinct from blended tg_watchlist_score."

      # T7 F5-C P2 — re-summarize LLM-error spike (informational health signal).
      # outcome="llm_error" is the only outcome that maps to a real provider
      # failure (locked / version_raced / no_card / no_bundle / empty_scope are
      # benign control-flow outcomes). Low-severity (info, not paging): mirrors
      # the HighLLMErrorRate ratio shape but on the re-summarize counter, with a
      # longer 30m window because re-summarize fires infrequently (per scheduler
      # tick / age trigger) so short windows are too noisy.
      - alert: ResummarizeLLMErrorRate
        expr: >
          sum(rate(tg_resummarize_total{outcome="llm_error"}[30m]))
          /
          sum(rate(tg_resummarize_total[30m]))
          > 0.2
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "F5-C re-summarize LLM-error rate >20%"
          description: "{{ $value | humanizePercentage }} of F5-C re-summarize attempts are failing with outcome=llm_error over 30m — check the resummarize LLM provider/credits."

  # F5-B Phase 0 (ADR-0016) — recording + GATE signal for the T2 decision.
  # The T2 gate asks: build F5-B Phase 1 (actual near-dup dedup) only if the
  # observed near-duplicate rate is >= 5% over ~7 days on the dominant axis
  # (dimension="intra" vs "cross"). We pre-compute the 7d rate as a recording
  # rule and alert (informational, NOT paging) when any axis crosses 5%.
  #
  # Denominator note: there is no dedicated "processed/embedded ProcessedDocument"
  # counter. tg_parser_messages_processed_total{status="success"} is the best
  # available proxy — every successfully processed message becomes a
  # ProcessedDocument that is embedded and then checked by the near-dup hook.
  - name: tg_parser_f5b_phase0
    rules:
      # 7d near-duplicate rate per axis = near-dup detections / processed docs.
      # Kept as a recording rule so the dashboard stat/timeseries and the alert
      # share one definition (single source of truth for the gate ratio).
      - record: tg:near_duplicate_rate:ratio7d
        expr: >
          sum(increase(tg_dedup_near_duplicates_detected_total[7d])) by (dimension)
          /
          scalar(sum(increase(tg_parser_messages_processed_total{status="success"}[7d])))

      # T2 GATE: notify (not page) when the 7d rate on any axis reaches 5%.
      # severity=info mirrors the NoMessagesProcessed precedent (informational,
      # non-incident). for:6h debounces the slow-moving 7d window so a single
      # boundary flicker does not fire. {{ $labels.dimension }} identifies the
      # dominant axis so the operator knows which axis triggered the gate.
      - alert: NearDuplicateRateGateF5BPhase1
        expr: tg:near_duplicate_rate:ratio7d >= 0.05
        for: 6h
        labels:
          severity: info
        annotations:
          summary: "F5-B near-dup 7d rate ≥5% on {{ $labels.dimension }} axis — time to evaluate Phase 1 (T2 gate)"
          description: "Observed near-duplicate rate on the {{ $labels.dimension }} axis is {{ $value | humanizePercentage }} over the trailing 7 days (T2 gate threshold = 5%). This is a 'evaluate F5-B Phase 1' signal, not an incident."

  # T7 F5-C P2 (Wave 2) — re-summarize FRESHNESS observation track. It asks: is
  # the RESUMMARIZE_MAX_AGE_DAYS *age* trigger too aggressive — i.e. are topics
  # being re-summarized mostly because the cutoff elapsed (staleness) rather
  # than because substantive new content arrived (the RESUMMARIZE_TRIGGER_N
  # counter)? The knob value is deliberately NOT quoted here: it has already
  # been raised once (14 -> 21) and a hard-coded number rots on the next bump.
  #
  # Axis note: trigger ∈ {counter, age, "-"} on tg_resummarize_total (Wave 2,
  # commit f0a1512). The observed axis is the AGE SHARE = age / (counter + age)
  # over a trailing 14d window. The "-" bucket (locked / no_card / no_bundle /
  # direct force where the trigger can't be classified) is excluded from the
  # denominator so the ratio reflects only real candidate-selection triggers.
  # As with ratio7d, when no counter/age re-summarizes occurred the expression
  # yields no sample (NaN) rather than a false zero.
  #
  # outcome="refusal_cooldown" is ALSO excluded, from BOTH sides of the ratio
  # (excluding it from the numerator alone would make the fraction meaningless).
  # Rationale (BUG-083): a topic that the LLM hard-refuses never commits a new
  # summary, so last_summarized_at never moves and the age predicate re-selects
  # it every tick forever. The refusal cooldown guard skips it BEFORE the LLM
  # call, so each such tick is a zero-cost skip — yet it still incremented
  # trigger="age". On 2026-08-05 that single poison-pill topic accounted for
  # ~330 of ~365 age events over 14d, i.e. the ratio was measuring "how often
  # we skipped one quarantined topic", not how aggressive the cutoff is.
  # Poison-pill visibility now lives in its own signal below
  # (tg:resummarize_refusal_cooldown:count24h +
  # ResummarizeRefusalCooldownPoisonPill), so excluding it here hides nothing.
  - name: tg_parser_f5c_phase2
    rules:
      # 14d age-trigger share = age-selected re-summarizes / (counter + age),
      # both sides net of zero-cost refusal_cooldown skips. Kept as a recording
      # rule so the dashboard panels share one definition (single source of
      # truth), mirroring tg:near_duplicate_rate:ratio7d. The rule NAME is
      # stable on purpose — consumers reference it by name.
      - record: tg:resummarize_age_trigger:ratio14d
        expr: >
          sum(increase(tg_resummarize_total{trigger="age",outcome!="refusal_cooldown"}[14d]))
          /
          scalar(sum(increase(tg_resummarize_total{trigger=~"counter|age",outcome!="refusal_cooldown"}[14d])))

      # NOTE: the former T7 GATE alert (ResummarizeAgeTriggerGateF5CPhase2,
      # ratio14d >= 0.5, severity=info) was REMOVED on 2026-08-05. The decision
      # it existed to trigger — "is the freshness cutoff too aggressive?" — is
      # closed: the re-watch checkpoint kept RESUMMARIZE_MAX_AGE_DAYS=21 and
      # rejected the 21 -> 30 bump (docs/notes/DELTA_T7_VERDICT_2026-07-22.md
      # § "Re-watch checkpoint CLOSED"). Even net of refusal_cooldown the share
      # sits around 0.90, because on low-volume channels the age branch is
      # legitimately the dominant source of PRODUCTIVE re-summarizes (~35 vs ~4
      # counter over 14d) at a couple of successful re-summarizes per day — so
      # the alert would stay permanently firing and only train operators to
      # ignore info alerts. ratio14d remains as an observation signal on the
      # Grafana panels; re-evaluating the cutoff is now a manual cadence
      # documented in docs/runbooks/F5C_DEPLOY_AND_WATCH.md § T7.

      # BUG-083 poison-pill visibility — the compensating signal for the gate
      # removed above. outcome="refusal_cooldown" means a topic is stuck in the
      # refusal quarantine: the tick skips it before the LLM call, so it costs 0
      # tokens, but the topic's summary is frozen and will never refresh on its
      # own. Nothing else alerts on it: ResummarizeLLMErrorRate counts only
      # outcome="llm_error", and the Grafana outcome panels are passive (someone
      # has to open them). 24h window rather than 14d so the signal clears once
      # the topic is cured instead of trailing a fortnight of history.
      - record: tg:resummarize_refusal_cooldown:count24h
        expr: sum(increase(tg_resummarize_total{outcome="refusal_cooldown"}[24h])) by (channel_id)

      # Threshold derivation: the scheduler tick runs ~hourly, so one live
      # poison-pill topic produces ~24 cooldown skips per day. 12 = a sustained
      # half-day, which no transient single refusal can reach. for:6h debounces.
      - alert: ResummarizeRefusalCooldownPoisonPill
        expr: tg:resummarize_refusal_cooldown:count24h >= 12
        for: 6h
        labels:
          severity: info
        annotations:
          summary: "F5-C re-summarize poison-pill on {{ $labels.channel_id }} — a topic is stuck in refusal cooldown"
          description: "{{ $value }} re-summarize attempts on {{ $labels.channel_id }} were skipped with outcome=refusal_cooldown over 24h — at least one topic is quarantined after a content-safety refusal and its summary is frozen. Zero token cost (the guard fires before the LLM call), so this is not a spend incident; it is a staleness one. See BUG-083 and docs/runbooks/F5C_DEPLOY_AND_WATCH.md § T7 for how to identify the topic and attempt recovery."

  # BUG-071 — topicization token-burn observability (post-top-up watch).
  # The shipped fix (prod HEAD bdca97f) stops the charged-but-truncated
  # (stop_reason=max_tokens) re-burn and bounds the per-tick full re-escalation
  # loop. These rules make the failure class alertable so a regression after the
  # Anthropic balance is restored is caught fast. See
  # docs/notes/MONITORING_PLAN_BUG071_POST_TOPUP_2026-06-27.md for the full plan,
  # PromQL derivation, log/DB checks and rollback triggers.
  #
  # Baseline incident (prod 2026-06-27, murashko_med, ~58 min / 3480s): one full
  # re-topicization = 334 batches / 328 failed / 0 cards / ~2.38M Sonnet tokens
  # (1.56M prompt + 0.82M completion). Derived rates used for thresholds below:
  #   total ≈ 684 tok/s, completion ≈ 236 tok/s, failed batches ≈ 0.094/s,
  #   avg completion ÷ call ≈ 8097 ≈ the 8192 cap.
  #
  # WHY THESE METRICS (not the existing HighLLMErrorRate): a truncated reply is
  # charged and returns HTTP 200, so record_llm_request folds it into
  # status="success" — HighLLMErrorRate cannot see it. tg_parser_llm_truncation_total
  # (BUG-071 Fix 3, labelled provider/model/stage) is the precise, stage-scoped
  # signal; the token/request-derived rules (P2/P3) are corroborating because
  # tg_parser_llm_tokens_total / _requests_total are NOT stage-scoped (they also
  # carry RAG / resummarize Sonnet traffic — topicization dominates during a burn).
  # The model matcher is a regex (claude-sonnet-4-6.*) so a dated Sonnet label
  # (cf. processing's claude-haiku-4-5-20251001) still matches.
  - name: tg_parser_bug071_topicization
    rules:
      # P1 — truncation rate spike: the BUG-071 re-burn canary. Healthy ~0.
      # >0.05/s ≈ half the pre-fix failed-batch rate (0.094/s) — early warning
      # that the Fix-1 shrink ladder may not be converging.
      - alert: TopicizationTruncationSpike
        expr: sum(rate(tg_parser_llm_truncation_total[5m])) > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Topicization max_tokens truncations sustained (>0.05/s)"
          description: "{{ $value }} truncations/s over 5m for 15m — Fix-1 shrink ladder may not be converging; check prompt/batch size."

      # P1b — burst: at/above the pre-fix incident failed-batch rate (~0.094/s;
      # the truncation counter is ≥ that due to split fan-out, so 0.2/s is a real
      # re-burn). Pages — consider rollback to 61637d1 / re-pause billing.
      - alert: TopicizationTruncationBurst
        expr: sum(rate(tg_parser_llm_truncation_total[5m])) > 0.2
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Topicization truncation burst (~pre-fix failed-batch rate)"
          description: "{{ $value }} truncations/s — at or above the pre-fix incident rate. Consider rollback / re-pause billing."

      # P2 — Sonnet near-cap completion: avg completion tokens ÷ call approaching
      # the 8192 output cap (baseline-bad ≈ 8097). Truncated calls count as
      # status="success" AND carry ~cap completion tokens, so both sides of the
      # ratio include them — this reproduces the incident's 8097 figure.
      # NB: do NOT clamp_min(denominator, 1) — topicization runs at ~0.03 req/s
      # (well below 1/s), so flooring the denominator at 1 would collapse the
      # ratio to the raw completion rate (~235) and the alert could never fire at
      # production scale. Divide-by-zero is handled naturally: with no Sonnet
      # calls both rates are 0 → 0/0 = NaN → comparison false; the explicit
      # `requests > 0` guard also rules out the (impossible-in-practice) +Inf
      # case where completion tokens exist without a recorded request.
      - alert: SonnetCompletionNearCap
        expr: >
          sum(rate(tg_parser_llm_tokens_total{model=~"claude-sonnet-4-6.*",token_type="completion"}[10m]))
          /
          sum(rate(tg_parser_llm_requests_total{model=~"claude-sonnet-4-6.*",status="success"}[10m]))
          > 6000
          and
          sum(rate(tg_parser_llm_requests_total{model=~"claude-sonnet-4-6.*",status="success"}[10m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Sonnet avg completion tokens/call approaching 8192 cap"
          description: "Avg {{ $value | printf \"%.0f\" }} completion tok/call over 10m (cap 8192, baseline-bad ~8097) — output routinely maxing out = truncation."

      # P3 — burning without progress: Sonnet completion-token spend up while 0
      # topic cards are produced. `or vector(0)` on the topics side is REQUIRED —
      # if tg_parser_topics_created_total has no series yet (no card ever created
      # post-deploy), sum(rate(...)) returns an empty vector and `== 0` would never
      # match, silently disabling the alert in exactly the worst case.
      - alert: TopicizationBurnNoProgress
        expr: >
          sum(rate(tg_parser_llm_tokens_total{model=~"claude-sonnet-4-6.*",token_type="completion"}[15m])) > 150
          and
          (sum(rate(tg_parser_topics_created_total[15m])) or vector(0)) == 0
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "Sonnet tokens burning but 0 topic cards created"
          description: "Completion-token rate high while topics_created flat for 30m — the BUG-071 burn-without-progress signature."

      # P3b — DIRECT failed-batch signal (BUG-071 observability upgrade). The new
      # first-class counter tg_parser_topicization_failed_batches_total mirrors
      # TopicizationPipelineImpl.failed_batches exactly (generate stage), counting
      # BOTH truncation-drops (corroborates tg_parser_llm_truncation_total) AND
      # genuine non-truncation batch failures (RuntimeError / parse-exhaustion /
      # billing) that the truncation counter does NOT cover. This is the direct
      # replacement for the "failed-batch ratio high" proxy that P1–P3 only
      # approximated. P3 (BurnNoProgress) is KEPT as a complementary backstop
      # because it also catches burn on the merge/discover/re-escalation paths that
      # do not increment failed_batches. Threshold mirrors P1 (0.05/s ≈ half the
      # pre-fix incident failed-batch rate of 0.094/s); by (stage) keeps the stage
      # in the alert — drill down by channel_id on the raw metric.
      - alert: TopicizationFailedBatchesHigh
        expr: sum(rate(tg_parser_topicization_failed_batches_total[15m])) by (stage) > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Topicization failed-batch rate high ({{ $labels.stage }})"
          description: "{{ $value | printf \"%.3f\" }} failed batches/s on stage {{ $labels.stage }} over 15m — batches producing 0 usable topics (truncation-drops or hard errors). Drill down by channel_id on tg_parser_topicization_failed_batches_total."

      # P4 — billing block did not clear after top-up. tg_parser_anthropic_billing_block_total
      # should rate→0 once credit is restored; sustained increments mean the
      # top-up was ineffective (wrong key / not applied) and processing won't drain.
      - alert: AnthropicBillingStillBlocked
        expr: sum(rate(tg_parser_anthropic_billing_block_total[10m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Anthropic billing blocks still occurring after top-up"
          description: "Top-up may not be effective / wrong key — processing won't drain."

  # BUG-072 / 073 / 074 / 075 + R1 — post-refill RE-BURN observability (added
  # 2026-06-30, prod HEAD 73d9a58). The tg_parser_bug071_topicization group above
  # covers the CATASTROPHIC storm class (truncation spike/burst, near-cap,
  # burn-no-progress, failed-batch rate, billing). This group adds the QUIETER
  # bounded-re-burn signals introduced by the fixes that shipped AFTER bdca97f:
  #   • BUG-072 — non-blocking per-channel advisory lock on FULL topicization.
  #   • BUG-073 — per-channel advisory locks on processing (F1) + incremental
  #     topicization (F3); benign lock-skip / defer.
  #   • BUG-074 — repair_json is applied BEFORE re-issuing a malformed-JSON
  #     topicization batch (kills the up-to-3× re-issue re-burn).
  #   • BUG-075 — STANDING convergent coverage reconciliation hook that feeds
  #     uncovered docs to Phase-2 discover AT MOST ONCE (discover_attempted
  #     marker); reconcile_only=True so it can NEVER trigger a full re-escalation.
  #   • R1 — tg_parser_topicization_discover_attempted_mark_failed_total: the
  #     only QUIET path back to bounded re-feed (marker write fails while the
  #     discover call succeeds → doc re-fed next tick).
  #
  # ⚠ Only metrics that EXIST at HEAD 73d9a58 are used below. Three token-burn
  # signals are NOT yet first-class Prometheus series; each is flagged with a
  # TODO naming the minimal counter that would close the gap. They are NOT
  # implemented here (this package is monitoring-only, no code changes). Until
  # then, watch them via the runbook's log/DB checks
  # (docs/notes/POST_REFILL_WATCH_RUNBOOK_2026-06-30.md).
  - name: tg_parser_bug075_reconcile_postrefill
    rules:
      # R1 — discover_attempted MARKER-WRITE failures (the headline new signal).
      # The reconcile hook bounds Phase-2 re-burn to ~0 in steady state by
      # writing a best-effort `topicization:discover_attempted:<ref>` marker for
      # every doc that consumed a discover call. _mark_discover_attempted
      # SWALLOWS write errors (a hiccup must never mask the caller's outcome),
      # but if the write fails PERSISTENTLY while the discover LLM call SUCCEEDS,
      # the doc stays unmarked → re-fed to Phase-2 next tick → BOUNDED re-burn
      # (capped by topicization_reconcile_max_docs=200 + random anti-starvation
      # sampling — NOT a storm, NOT abandonment). Pre-R1 this was only visible at
      # logger.debug. Healthy = EXACTLY 0 (the marker store should always write).
      # Any sustained non-zero is genuinely actionable: the channel's marker
      # writes are degrading (DB / processing_failures repo issue). by(channel_id)
      # names the offending channel. severity warning (bounded cost, not a page).
      - alert: TopicizationDiscoverMarkerWriteFailing
        expr: sum(rate(tg_parser_topicization_discover_attempted_mark_failed_total[15m])) by (channel_id) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Reconcile discover_attempted marker writes failing ({{ $labels.channel_id }})"
          description: "{{ $value | printf \"%.3f\" }} marker-write failures/s on channel {{ $labels.channel_id }} over 15m (R1). Docs that completed a Phase-2 discover are NOT being marked → re-fed next tick → bounded re-burn. Check the processing_failures repo / DB write path for this channel."

      # BUG-074 — topicization JSON-parse-retry spike. After BUG-074 the three
      # topicization stages run repair_json BEFORE counting a parse failure, so a
      # malformed-but-repairable reply (the BUG-065 unescaped-quote / trailing-comma
      # class) is parsed on the FIRST attempt and emits NO retry. A sustained
      # retry rate on a topicization stage therefore means repair is NOT catching
      # the malformed-JSON class → the oversized batch prompt is being RE-ISSUED
      # (charged Sonnet re-burn) up to the reduced cap of 2. This is the
      # BUG-074-specific complement to TopicizationFailedBatchesHigh (which only
      # sees the generate stage today); json-parse-retry covers generate + merge +
      # discover, so a merge/discover-stage re-burn shows here even when
      # failed_batches is quiet. Threshold mirrors P1 (0.05/s ≈ half the pre-fix
      # incident failed-batch rate of 0.094/s). by(stage) keeps the stage in the
      # alert. NOTE: stage="processing" (per-message path) is intentionally
      # EXCLUDED via the topicization_.* matcher — it has always used repair_json
      # and its retries are not the BUG-074 re-burn class.
      - alert: TopicizationJsonRepairRetrySpike
        expr: sum(rate(tg_parser_llm_json_parse_retry_total{stage=~"topicization_.*"}[15m])) by (stage) > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Topicization JSON-parse-retry rate high ({{ $labels.stage }})"
          description: "{{ $value | printf \"%.3f\" }} JSON-parse retries/s on stage {{ $labels.stage }} over 15m. After BUG-074 repair_json should parse malformed replies on the first attempt — a sustained rate means repair is missing the class and the batch prompt is being re-issued (charged re-burn). Inspect a sample reply."

      # RECONCILE re-burn — docs fed to Phase-2 discover by the BUG-075 standing
      # reconciliation hook (the reconcile_only path), now a FIRST-CLASS counter
      # tg_parser_topicization_reconcile_discover_docs_total{channel_id} emitted
      # at the reconcile discover site (closes the former "reconcile re-burn" gap).
      #
      # WHY THIS SHAPE (sustained-non-zero over a long window, NOT a rate
      # threshold): the reconcile hook's convergence invariant is at-most-one
      # discover per uncovered doc (each completed Phase-2 writes a
      # discover_attempted marker → the doc leaves the candidate set). So a
      # legitimate backlog-drain (post-refill, or a freshly-processed batch) is
      # BURSTY and FINITE — it feeds each doc once and then the candidate set
      # empties and the rate decays back to 0 within the [1h] window. The red flag
      # is the OPPOSITE: reconcile issuing discover calls that NEVER stop —
      # non-convergence (uncovered docs that keep being re-fed because markers are
      # not persisting → the R1 alert above is the direct cause-signal) or a
      # channel whose uncovered set never settles. A bare `> 0` on a [1h] rate
      # held for: 2h fires only when there has been reconcile-discover activity in
      # essentially every trailing-1h window across a continuous 2h+ span (no 1h
      # gap) — i.e. discover that does not converge. A one-shot drain (even a large
      # one) decays out of the [1h] window long before the 2h debounce matures, so
      # it stays silent. by(channel_id) names the non-converging channel. severity
      # warning: bounded cost (cap topicization_reconcile_max_docs=200 + sampling),
      # investigate (pair with the R1 marker-write alert + the runbook reconcile
      # log/DB checks) rather than page.
      - alert: TopicizationReconcileDiscoverSustained
        expr: sum(rate(tg_parser_topicization_reconcile_discover_docs_total[1h])) by (channel_id) > 0
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "Reconcile discover not converging ({{ $labels.channel_id }})"
          description: "{{ $value | printf \"%.4f\" }} docs/s fed to Phase-2 discover by the BUG-075 reconcile hook on channel {{ $labels.channel_id }}, sustained over 2h. Transient backlog-drain is expected to decay to 0 (at-most-one-discover marker); a sustained rate means reconcile is NOT converging — check the discover_attempted marker writes (R1 alert / processing_failures) and whether the channel's uncovered backlog keeps growing."

      # ─────────────────────────────────────────────────────────────────────
      # GAPS — signals NOT yet observable as Prometheus series at HEAD 73d9a58.
      # Each TODO names the minimal counter that would close it. NONE are
      # implemented in this monitoring package (no further code changes). Until
      # added, watch via the runbook's log/DB checks. (The former "reconcile
      # re-burn" gap is now closed by TopicizationReconcileDiscoverSustained
      # above; the two below remain intentionally un-implemented this round.)
      #
      # TODO (full re-escalation storm): the BUG-071 Fix-2 / BUG-072 re-escalation
      #   lifecycle (arm / skip-cooldown / fire / clear) is observable ONLY via
      #   logs (`escalating to full topicization`, `re-escalation skipped
      #   (cooldown)`) + the processing_failures `topicization:reescalation:<id>`
      #   marker SQL. The "full re-topicization storm on a zero-card channel" case
      #   is therefore caught today only by the bug071 group's burn-without-progress
      #   / truncation proxies, not by a direct re-escalation series. Minimal fix:
      #   a Counter tg_parser_topicization_reescalation_total{channel_id,outcome=
      #   fired|skipped_cooldown|cleared} → a `fired` spike on consecutive ticks
      #   would directly alert on cooldown failure.
      #
      # TODO (advisory-lock contention / stuck convergence): BUG-072/073 lock
      #   skips and incremental defers are logged (`*_skipped_already_in_flight`,
      #   `deferred_locked=True`) but have NO counter, so a high sustained defer
      #   rate (which could indicate stuck convergence / a wedged long run) is not
      #   alertable. Minimal fix: a Counter tg_parser_channel_lock_skip_total{
      #   stage,outcome=skipped|deferred|proceeded}.
      # ─────────────────────────────────────────────────────────────────────

  # ── BUG-077 — resumable-full-run token-leak hardening (F1/F9). All series are
  # emitted ONLY on the chunked/resumable full path (topicization_full_resume_
  # enabled=True) — the group is inert while the feature ships dark.
  - name: tg_parser_bug077_full_run_hardening
    rules:
      # F1 drip signature — the resume driver keeps re-invoking a live
      # checkpoint (resume_total rising) while chunk progress is flat
      # (chunks{kind=done} unchanged): a channel resuming forever without
      # advancing. The circuit-breaker should trip long before 30m; this alert
      # is the backstop for a mis-tuned/disabled breaker.
      - alert: TopicizationFullRunResumeNoProgress
        expr: >
          sum(increase(tg_parser_topicization_full_run_resume_total[30m])) by (channel_id) >= 3
          and
          sum(delta(tg_parser_topicization_full_run_chunks{kind="done"}[30m])) by (channel_id) == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Full-run resumes without chunk progress ({{ $labels.channel_id }})"
          description: "Channel {{ $labels.channel_id }} was resumed >=3x in 30m while chunks done stayed flat — the BUG-077 F1 non-advancing drip. Check tg_parser_topicization_full_run_chunk_failed_total for the failing reason and whether the no-progress circuit-breaker is enabled (topicization_full_resume_noprogress_limit)."

      # F9 — any sustained non-advancing chunk halt (merge_halt /
      # malformed_merge / empty_after_failure / commit_failed). One-off halts
      # (billing dip, transient timeout) are expected and resume cleanly; a
      # sustained rate means the same chunk keeps failing deterministically.
      - alert: TopicizationFullRunChunkFailedSustained
        expr: sum(rate(tg_parser_topicization_full_run_chunk_failed_total[30m])) by (channel_id, reason) > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Full-run chunks failing without advancing ({{ $labels.channel_id }}/{{ $labels.reason }})"
          description: "{{ $value | printf \"%.4f\" }} failed chunks/s (reason={{ $labels.reason }}) on channel {{ $labels.channel_id }} sustained over 1h — generate+merge spend that never commits. The F1 breaker bounds the spend; fix the underlying chunk failure (constraint-violating card, truncation-dropped batch, malformed merge reply)."

      # F1 breaker holding a channel — informational: the drip is BOUNDED (one
      # probe per cooldown window) but the run is stuck and needs a human.
      - alert: TopicizationFullRunCircuitOpen
        expr: sum(rate(tg_parser_topicization_full_run_noprogress_skip_total[30m])) by (channel_id) > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Full-run no-progress circuit-breaker open ({{ $labels.channel_id }})"
          description: "The BUG-077 F1 breaker is skipping resumes for channel {{ $labels.channel_id }} (consecutive no-progress limit reached). Spend is bounded to one probe per topicization_full_resume_noprogress_cooldown_s window, but the run will not finish on its own — inspect the failing chunk, then clear/fix and the breaker resets on the next advancing probe."

  # ── BUG-084 — embedding-quota / rate-limit observability. The fix
  # (fix/bug084-embedding-429-backoff, prod HEAD febb67e) classifies OpenAI
  # /v1/embeddings 429s by error.code: terminal ``insufficient_quota`` raises
  # ``EmbeddingQuotaError`` immediately (no retry) and transient
  # ``rate_limit_exceeded`` / 5xx backs off then raises ``EmbeddingRateLimitError``
  # on exhaustion. Both outcomes are recorded on the metric
  #   tg_embedding_requests_total{outcome, stage}
  # (tg_parser/api/metrics.py::EMBEDDING_REQUESTS_TOTAL, record_embedding_outcome),
  # emitted at the two embedding consumer call sites — background_scheduler
  # (stage=background_message|background_topic) and retrieval_service
  # (stage=rag_query). outcome ∈ {ok, rate_limited, quota_exhausted, error};
  # this group alerts on the two failure outcomes so a repeat of the prod
  # incident (2026-07-07/-12: /v1/embeddings stuck in terminal insufficient_quota
  # for ~2h) is visible immediately instead of via a manual /metrics grep.
  #
  # SCRAPE PATH: the counter is a module-level prometheus_client Counter on the
  # default registry, so it is exposed on the app's /metrics endpoint and scraped
  # by the tg_parser_api job (docker/prometheus.yml) — same path as every other
  # scraped tg_parser_* / tg_* series.
  #
  # WHY SUM (no `by (stage)`): terminal insufficient_quota is an account-global
  # billing state — it hits background embedding AND the live RAG-query embed at
  # once, so a single account-level alert (sum across stages) is the right signal,
  # not one page per stage. Drill down by {stage} on the raw metric.
  - name: tg_parser_bug084_embedding_quota
    rules:
      # PRIMARY — sustained terminal quota exhaustion. outcome="quota_exhausted"
      # is emitted ONLY on EmbeddingQuotaError, which the client raises WITHOUT
      # retry and which clears ONLY via an operator billing/tier action — so its
      # mere sustained presence is the signal (the count is not meaningful).
      #
      # Threshold >0 over [15m] + for:30m: the measurement window (15m) is shorter
      # than the debounce (30m) — mirrors AnthropicBillingStillBlocked's
      # window<for shape (the closest analog: a persistent provider billing/credit
      # block) — so a single transient quota_exhausted classification ages out of
      # the [15m] window (at ~15m) long before the 30m debounce matures and CANNOT
      # page; only a genuinely sustained terminal state (every subsequent embedding
      # attempt re-classified quota_exhausted) keeps increase>0 continuously and
      # fires ~30m after onset. 30m detection latency is acceptable for a state
      # that persisted ~2h in prod and needs a human billing action regardless.
      # severity warning matches AnthropicBillingStillBlocked (operator-actionable
      # billing block, not a code fix) and WatchlistSemanticUnavailableHigh (RAG
      # degraded to keyword-only) — RAG stays UP via the BUG-084 keyword fallback,
      # so this is a degradation, not a hard down (which would be critical).
      - alert: EmbeddingQuotaExhausted
        expr: sum(increase(tg_embedding_requests_total{outcome="quota_exhausted"}[15m])) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Embedding requests terminally failing (OpenAI insufficient_quota) — BUG-084"
          description: "Embedding requests have been failing with terminal OpenAI insufficient_quota (outcome=quota_exhausted) sustained for 30m — semantic/hybrid RAG has degraded to keyword-only (BUG-084). This is a billing/tier state, NOT a code bug: add credits / raise the usage tier at platform.openai.com (see docs/runbooks/OPENAI_EMBEDDING_QUOTA_RECOVERY.md). Code cannot restore embeddings without the billing action."

      # SECONDARY — sustained transient rate-limiting (lower severity). Distinct
      # from quota: outcome="rate_limited" is emitted after the client's jittered
      # backoff exhausts its retry budget (EmbeddingRateLimitError) on transient
      # rate_limit_exceeded / 5xx — it SELF-CLEARS once throughput drops, so an
      # occasional burst is expected and must NOT page. Same >0 over [15m] +
      # for:30m shape as the primary, but severity=info (mirrors NoMessagesProcessed
      # / ResummarizeLLMErrorRate — notify, don't page): a rate_limited outcome
      # sustained continuously for 30m is chronic throttling worth investigating
      # (an embedding concurrency cap / tier bump — the BUG-084 Q3/Q4 deferred
      # knob), as opposed to the terminal-billing quota case above.
      - alert: EmbeddingRateLimitedSustained
        expr: sum(increase(tg_embedding_requests_total{outcome="rate_limited"}[15m])) > 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "Embedding requests sustained rate-limited (transient throttling) — BUG-084"
          description: "Embedding requests have been exhausting their retry budget on transient OpenAI rate_limit_exceeded / 5xx (outcome=rate_limited) sustained for 30m — semantic/hybrid RAG transiently degrades to keyword-only during throttling (BUG-084). Self-clears when throughput drops; if chronic, consider an embedding concurrency cap / usage-tier bump. Distinct from the terminal quota_exhausted case (EmbeddingQuotaExhausted)."

  # B1 / BUG-085 — incremental ingestion all-sources-failing outage.
  # Metric: tg_parser_incremental_pipeline_sources_total{outcome}. Complements
  # tg_parser_scheduler_tasks_total (which stays status="success" when the job
  # returns without raise — the ~18h SessionCryptoError outage signature).
  # SCRAPE PATH: module-level prometheus_client Counter on the default registry,
  # exposed on /metrics, scraped by tg_parser_api (same path as every other
  # tg_parser_* series).
  - name: tg_parser_incremental_ingestion
    rules:
      # B1 — every active source failed HARD across ≥2 consecutive ticks while
      # NONE succeeded. This is the ~18h SessionCryptoError outage signature
      # (succeeded=0, failed=13). tg_parser_scheduler_tasks_total stays
      # status="success" through such an outage (the job returns without
      # raising), so THIS metric is the only signal. degraded is a SEPARATE
      # label and is intentionally NOT in the condition — a benign degraded
      # tick (per-post MsgIdInvalidError / temporary billing block) must NOT page.
      #
      # WHY the single-blip guard lives ENTIRELY in the SECOND conjunct — NOT in
      # a window<for relationship. Here window 2h > for 30m, the OPPOSITE of the
      # BUG-084 EmbeddingQuotaExhausted template ([15m] < for:30m), so the
      # for/window relationship does NOT provide benign-blip protection. That
      # protection comes solely from `increase(succeeded[2h]) == 0`: it requires
      # ZERO successful ticks in the trailing 2h, so under normal hourly
      # operation the alert can only BEGIN firing ~2h after the LAST success
      # (i.e. after ≥2 consecutive failed ticks with no success in between); the
      # for:30m then debounces on top of that (→ ~2–2.5h detection). The
      # succeeded `or vector(0)` guard keeps the `== 0` term from silently
      # disabling the alert when the succeeded series has no samples in the
      # window (analogous to TopicizationBurnNoProgress's `or vector(0)`).
      - alert: IncrementalIngestionAllSourcesFailing
        expr: >
          sum(increase(tg_parser_incremental_pipeline_sources_total{outcome="failed"}[2h])) > 0
          and
          (sum(increase(tg_parser_incremental_pipeline_sources_total{outcome="succeeded"}[2h])) or vector(0)) == 0
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "Incremental ingestion: every source failing, none succeeding"
          description: "All active sources failed HARD across the trailing 2h (≥2 ticks) with ZERO successes — an ingestion outage (e.g. the BUG-078-class TELEGRAM_SESSION_KEY / SessionCryptoError incident, prod 2026-07-16→17, fix 1fbc9b5). degraded ticks are excluded. Check tg_parser logs for 'Incremental pipeline completed: succeeded=0' + SessionCryptoError and the tg_parser compose env allow-list."

  # F9 Phase 2 — prompt-injection suspect monitoring (log + metric; requests are NOT blocked).
  - name: tg_parser_f9_prompt_injection
    rules:
      # Sustained suspect rate across bot/rag/processing surfaces. Info severity —
      # notify operators to review patterns; do not page (false positives expected).
      - alert: PromptInjectionSuspectSustained
        expr: sum(increase(tg_parser_prompt_injection_suspect_total[15m])) > 5
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "Sustained prompt-injection suspect inputs (F9 Phase 2)"
          description: "{{ $value }} prompt-injection suspect hits over 15m, sustained 30m (surfaces: bot|rag|processing). Requests are not blocked — review logs for prompt_injection_suspect=true. Defense-in-depth only; not 100% injection immunity."
