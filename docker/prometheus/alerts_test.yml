# promtool unit tests for docker/prometheus/alerts.yml
#
# Focused on WatchlistSemanticUnavailableHigh (D1 / Wave-2 T6): the keyword-only
# (semantic-unavailable) share tripwire
#
#   sum(rate(tg_watchlist_semantic_unavailable_total[1h]))
#   / sum(rate(tg_watchlist_matches_total[1h])) > 0.5   for: 6h
#
# Run:  promtool test rules docker/prometheus/alerts_test.yml
#
# Timing note: the rule has for:6h on top of a [1h] rate window, so each
# scenario feeds ~7h of counter samples (interval 1m) and asserts at eval_time
# 7h — past the 6h debounce — so a firing alert has had time to mature.
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  # (a) HIGH-ratio: ~80% of scored matches degrade to keyword-only, sustained
  # well past the 6h for: debounce. Counters grow linearly (sem +8/min,
  # matches +10/min) so rate(sem[1h]) / rate(matches[1h]) = 8/10 = 0.8 > 0.5.
  # Asserts WatchlistSemanticUnavailableHigh is FIRING at 7h.
  - name: WatchlistSemanticUnavailableHigh fires on sustained >50% keyword-only share
    interval: 1m
    input_series:
      - series: 'tg_watchlist_semantic_unavailable_total{reason="no_doc_embedding"}'
        values: '0+8x420'
      - series: 'tg_watchlist_matches_total'
        values: '0+10x420'
    alert_rule_test:
      - eval_time: 7h
        alertname: WatchlistSemanticUnavailableHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "F11 watchlist keyword-only (semantic-unavailable) share >50%"
              description: "80% of scored watchlist matches degraded to keyword-only (no semantic signal) over 1h — interest or document embeddings are likely missing; check the embedding backfill. Distinct from blended tg_watchlist_score."

  # (b) LOW-ratio: ~0.83% keyword-only share (sem +1/min, matches +120/min →
  # 1/120 = 0.0083), matching the real ~0.83% measured fraction. Well under the
  # 0.5 threshold, so the alert must NOT fire even after 7h.
  - name: WatchlistSemanticUnavailableHigh stays silent at the real ~0.83% share
    interval: 1m
    input_series:
      - series: 'tg_watchlist_semantic_unavailable_total{reason="no_doc_embedding"}'
        values: '0+1x420'
      - series: 'tg_watchlist_matches_total'
        values: '0+120x420'
    alert_rule_test:
      - eval_time: 7h
        alertname: WatchlistSemanticUnavailableHigh
        exp_alerts: []

  # ==========================================================================
  # BUG-095 — WatchlistMatchesUndelivered: matches recorded, never delivered.
  # The gauge is a level, not a rate, so the scenarios below are about the
  # for:1h debounce rather than about a threshold.
  # ==========================================================================

  # (a) A backlog that does not clear — the shape of the actual outage. The
  # gauge sits at 3 for two hours; the alert matures at 1h and is firing at 2h.
  - name: WatchlistMatchesUndelivered fires on a backlog that does not clear
    interval: 1m
    input_series:
      - series: 'tg_watchlist_undelivered_matches'
        values: '3x120'
    alert_rule_test:
      - eval_time: 2h
        alertname: WatchlistMatchesUndelivered
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "F11 watchlist matches recorded but not delivered"
              description: "3 watchlist match(es) have stayed notified=false past their flush interval for an hour — instant delivery is not reaching Telegram (BUG-095 class). Check watchlist_instant_flush in the bot process."

  # (b) Healthy delivery: the gauge stays at zero, so nothing fires. This is the
  # state the one-off backlog reconciliation establishes before the metric goes
  # live — an alert born red would train the operator to ignore it, which is the
  # mechanism that kept BUG-095 alive for two months.
  - name: WatchlistMatchesUndelivered stays silent while delivery is healthy
    interval: 1m
    input_series:
      - series: 'tg_watchlist_undelivered_matches'
        values: '0x120'
    alert_rule_test:
      - eval_time: 2h
        alertname: WatchlistMatchesUndelivered
        exp_alerts: []

  # (c) A blip shorter than the debounce: a bot restart strands a couple of
  # matches for ~20 minutes and the next reconciliation clears them. Must not
  # page — the debounce exists precisely for this.
  - name: WatchlistMatchesUndelivered ignores a sub-hour blip
    interval: 1m
    input_series:
      - series: 'tg_watchlist_undelivered_matches'
        values: '0x30 2x20 0x70'
    alert_rule_test:
      - eval_time: 2h
        alertname: WatchlistMatchesUndelivered
        exp_alerts: []

  # ==========================================================================
  # BUG-071 — topicization token-burn alerts (group tg_parser_bug071_topicization)
  # Thresholds derived from the prod incident (684 tok/s total, 236 tok/s
  # completion, 0.094 failed-batch/s, avg completion/call ~8097 ≈ 8192 cap).
  # ==========================================================================

  # P1 — moderate truncation rate (0.1/s) fires the warning Spike but NOT the
  # critical Burst (>0.2). +6/min → rate[5m] = 30/300 = 0.1/s. Spike for:15m
  # fires at 20m; eval at 30m (matured).
  - name: TopicizationTruncationSpike fires at moderate rate; Burst stays silent
    interval: 1m
    input_series:
      - series: 'tg_parser_llm_truncation_total{provider="anthropic",model="claude-sonnet-4-6",stage="topicization_generate"}'
        values: '0+6x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: TopicizationTruncationSpike
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Topicization max_tokens truncations sustained (>0.05/s)"
              description: "0.1 truncations/s over 5m for 15m — Fix-1 shrink ladder may not be converging; check prompt/batch size."
      - eval_time: 30m
        alertname: TopicizationTruncationBurst
        exp_alerts: []

  # P1b — high truncation rate (0.3/s) fires BOTH Burst (critical) and Spike
  # (warning). +18/min → rate[5m] = 90/300 = 0.3/s. Burst for:10m fires at 15m,
  # Spike for:15m fires at 20m; eval at 30m (both matured). discover stage proves
  # the rule is stage-agnostic (sum over all stages).
  - name: TopicizationTruncationBurst fires at high rate (also trips Spike)
    interval: 1m
    input_series:
      - series: 'tg_parser_llm_truncation_total{provider="anthropic",model="claude-sonnet-4-6",stage="topicization_discover"}'
        values: '0+18x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: TopicizationTruncationBurst
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Topicization truncation burst (~pre-fix failed-batch rate)"
              description: "0.3 truncations/s — at or above the pre-fix incident rate. Consider rollback / re-pause billing."
      - eval_time: 30m
        alertname: TopicizationTruncationSpike
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Topicization max_tokens truncations sustained (>0.05/s)"
              description: "0.3 truncations/s over 5m for 15m — Fix-1 shrink ladder may not be converging; check prompt/batch size."

  # P1/P1b negative — low truncation rate (~0.0167/s) trips neither. +1/min →
  # rate[5m] = 5/300 = 0.0167/s < 0.05.
  - name: Truncation alerts stay silent at a low truncation rate
    interval: 1m
    input_series:
      - series: 'tg_parser_llm_truncation_total{provider="anthropic",model="claude-sonnet-4-6",stage="topicization_generate"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: TopicizationTruncationSpike
        exp_alerts: []
      - eval_time: 30m
        alertname: TopicizationTruncationBurst
        exp_alerts: []

  # P2 — avg completion ÷ call = 8000 (near the 8192 cap) fires. completion
  # +8000/min, success requests +1/min → rate(completion[10m]) / rate(req[10m])
  # = (80000/600) / (10/600) = 8000 > 6000. for:15m fires at 25m; eval at 30m.
  - name: SonnetCompletionNearCap fires when avg completion approaches the cap
    interval: 1m
    input_series:
      - series: 'tg_parser_llm_tokens_total{provider="anthropic",model="claude-sonnet-4-6",token_type="completion"}'
        values: '0+8000x60'
      - series: 'tg_parser_llm_requests_total{provider="anthropic",model="claude-sonnet-4-6",status="success"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: SonnetCompletionNearCap
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Sonnet avg completion tokens/call approaching 8192 cap"
              description: "Avg 8000 completion tok/call over 10m (cap 8192, baseline-bad ~8097) — output routinely maxing out = truncation."

  # P2 negative — avg completion 2000/call (well below 6000) stays silent.
  - name: SonnetCompletionNearCap stays silent at a healthy avg completion size
    interval: 1m
    input_series:
      - series: 'tg_parser_llm_tokens_total{provider="anthropic",model="claude-sonnet-4-6",token_type="completion"}'
        values: '0+2000x60'
      - series: 'tg_parser_llm_requests_total{provider="anthropic",model="claude-sonnet-4-6",status="success"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: SonnetCompletionNearCap
        exp_alerts: []

  # P3 — burn-with-no-progress fires when topics_created_total EXISTS but is flat
  # (rate 0). completion +100000/min → rate[15m] = 1.5M/900 = 1666/s > 150;
  # topics flat → rate 0 → (==0) true. for:30m fires at 45m; eval at 50m.
  - name: TopicizationBurnNoProgress fires when tokens burn and topics are flat
    interval: 1m
    input_series:
      - series: 'tg_parser_llm_tokens_total{provider="anthropic",model="claude-sonnet-4-6",token_type="completion"}'
        values: '0+100000x70'
      - series: 'tg_parser_topics_created_total{channel_id="murashko_med"}'
        values: '0+0x70'
    alert_rule_test:
      - eval_time: 50m
        alertname: TopicizationBurnNoProgress
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Sonnet tokens burning but 0 topic cards created"
              description: "Completion-token rate high while topics_created flat for 30m — the BUG-071 burn-without-progress signature."

  # P3 — the `or vector(0)` scenario: topics_created_total has NO series at all
  # (no card ever created). Without `or vector(0)` the `== 0` term would be an
  # empty vector and the alert could never fire — this proves it DOES fire.
  - name: TopicizationBurnNoProgress fires when topics_created series is ABSENT (or vector(0))
    interval: 1m
    input_series:
      - series: 'tg_parser_llm_tokens_total{provider="anthropic",model="claude-sonnet-4-6",token_type="completion"}'
        values: '0+100000x70'
    alert_rule_test:
      - eval_time: 50m
        alertname: TopicizationBurnNoProgress
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Sonnet tokens burning but 0 topic cards created"
              description: "Completion-token rate high while topics_created flat for 30m — the BUG-071 burn-without-progress signature."

  # P3 negative — tokens burning BUT topics_created is also advancing (rate > 0),
  # so the burn IS making progress → must NOT fire.
  - name: TopicizationBurnNoProgress stays silent when topics are being created
    interval: 1m
    input_series:
      - series: 'tg_parser_llm_tokens_total{provider="anthropic",model="claude-sonnet-4-6",token_type="completion"}'
        values: '0+100000x70'
      - series: 'tg_parser_topics_created_total{channel_id="murashko_med"}'
        values: '0+5x70'
    alert_rule_test:
      - eval_time: 50m
        alertname: TopicizationBurnNoProgress
        exp_alerts: []

  # P3b — direct failed-batch signal fires. +6/min on the generate stage →
  # rate[15m] = 90/900 = 0.1/s > 0.05. for:15m fires at ~17m; eval at 35m.
  # exp_labels carries the by(stage) label.
  - name: TopicizationFailedBatchesHigh fires on a sustained failed-batch rate
    interval: 1m
    input_series:
      - series: 'tg_parser_topicization_failed_batches_total{stage="topicization_generate",channel_id="murashko_med"}'
        values: '0+6x60'
    alert_rule_test:
      - eval_time: 35m
        alertname: TopicizationFailedBatchesHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              stage: topicization_generate
            exp_annotations:
              summary: "Topicization failed-batch rate high (topicization_generate)"
              description: "0.100 failed batches/s on stage topicization_generate over 15m — batches producing 0 usable topics (truncation-drops or hard errors). Drill down by channel_id on tg_parser_topicization_failed_batches_total."

  # P3b negative — low failed-batch rate (+1/min → 15/900 = 0.0167/s < 0.05) is
  # silent (e.g. an occasional drop that the Fix-1 shrink ladder recovers from).
  - name: TopicizationFailedBatchesHigh stays silent at a low failed-batch rate
    interval: 1m
    input_series:
      - series: 'tg_parser_topicization_failed_batches_total{stage="topicization_generate",channel_id="murashko_med"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 35m
        alertname: TopicizationFailedBatchesHigh
        exp_alerts: []

  # P4 — billing block still occurring after top-up fires. +6/min →
  # rate[10m] = 60/600 = 0.1/s > 0. for:15m fires at 25m; eval at 30m.
  - name: AnthropicBillingStillBlocked fires while billing blocks persist
    interval: 1m
    input_series:
      - series: 'tg_parser_anthropic_billing_block_total{stage="processing"}'
        values: '0+6x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: AnthropicBillingStillBlocked
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Anthropic billing blocks still occurring after top-up"
              description: "Top-up may not be effective / wrong key — processing won't drain."

  # P4 negative — no new billing blocks (flat counter) → rate 0 → silent.
  - name: AnthropicBillingStillBlocked stays silent when billing is unblocked
    interval: 1m
    input_series:
      - series: 'tg_parser_anthropic_billing_block_total{stage="processing"}'
        values: '0+0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: AnthropicBillingStillBlocked
        exp_alerts: []

  # ==========================================================================
  # BUG-072/073/074/075 + R1 — post-refill re-burn alerts
  # (group tg_parser_bug075_reconcile_postrefill, added 2026-06-30).
  # ==========================================================================

  # R1 — discover_attempted marker-write failures fire. +2/min on one channel →
  # rate[15m] = 30/900 = 0.0333/s > 0. for:15m fires at ~17m; eval at 35m.
  # exp_labels carries the by(channel_id) label. Healthy steady state is EXACTLY
  # 0, so the threshold is a bare `> 0`.
  - name: TopicizationDiscoverMarkerWriteFailing fires on persistent marker-write failures
    interval: 1m
    input_series:
      - series: 'tg_parser_topicization_discover_attempted_mark_failed_total{channel_id="murashko_med"}'
        values: '0+2x60'
    alert_rule_test:
      - eval_time: 35m
        alertname: TopicizationDiscoverMarkerWriteFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              channel_id: murashko_med
            exp_annotations:
              summary: "Reconcile discover_attempted marker writes failing (murashko_med)"
              description: "0.033 marker-write failures/s on channel murashko_med over 15m (R1). Docs that completed a Phase-2 discover are NOT being marked → re-fed next tick → bounded re-burn. Check the processing_failures repo / DB write path for this channel."

  # R1 negative — healthy: marker writes never fail (flat counter) → rate 0 →
  # silent (the expected steady state).
  - name: TopicizationDiscoverMarkerWriteFailing stays silent when markers persist
    interval: 1m
    input_series:
      - series: 'tg_parser_topicization_discover_attempted_mark_failed_total{channel_id="murashko_med"}'
        values: '0+0x60'
    alert_rule_test:
      - eval_time: 35m
        alertname: TopicizationDiscoverMarkerWriteFailing
        exp_alerts: []

  # BUG-074 — JSON-parse-retry spike fires. +6/min on the discover stage →
  # rate[15m] = 90/900 = 0.1/s > 0.05. for:15m fires at ~17m; eval at 35m. The
  # discover stage proves the rule covers merge/discover (not just generate,
  # which TopicizationFailedBatchesHigh already sees).
  - name: TopicizationJsonRepairRetrySpike fires on a sustained topicization retry rate
    interval: 1m
    input_series:
      - series: 'tg_parser_llm_json_parse_retry_total{stage="topicization_discover"}'
        values: '0+6x60'
    alert_rule_test:
      - eval_time: 35m
        alertname: TopicizationJsonRepairRetrySpike
        exp_alerts:
          - exp_labels:
              severity: warning
              stage: topicization_discover
            exp_annotations:
              summary: "Topicization JSON-parse-retry rate high (topicization_discover)"
              description: "0.100 JSON-parse retries/s on stage topicization_discover over 15m. After BUG-074 repair_json should parse malformed replies on the first attempt — a sustained rate means repair is missing the class and the batch prompt is being re-issued (charged re-burn). Inspect a sample reply."

  # BUG-074 negative (low rate) — +1/min → rate[15m] = 15/900 = 0.0167/s < 0.05
  # → silent (an occasional repair miss the reduced cap absorbs).
  - name: TopicizationJsonRepairRetrySpike stays silent at a low retry rate
    interval: 1m
    input_series:
      - series: 'tg_parser_llm_json_parse_retry_total{stage="topicization_generate"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 35m
        alertname: TopicizationJsonRepairRetrySpike
        exp_alerts: []

  # BUG-074 negative (wrong stage) — the per-message processing path is EXCLUDED
  # by the topicization_.* matcher. A high processing-stage retry rate (+6/min)
  # must NOT fire this topicization rule.
  - name: TopicizationJsonRepairRetrySpike ignores the per-message processing stage
    interval: 1m
    input_series:
      - series: 'tg_parser_llm_json_parse_retry_total{stage="processing"}'
        values: '0+6x60'
    alert_rule_test:
      - eval_time: 35m
        alertname: TopicizationJsonRepairRetrySpike
        exp_alerts: []

  # Reconcile re-burn (non-convergence) — SUSTAINED reconcile-discover feed fires.
  # +5/min CONTINUOUS → rate[1h] = 300/3600 = 0.0833/s, never decays to 0. The
  # condition is true from the first minute; for:2h matures at ~2h, so eval at 3h
  # is firing. exp_labels carries the by(channel_id) label. This models the red
  # flag: reconcile issuing discover calls that never stop.
  - name: TopicizationReconcileDiscoverSustained fires on a non-converging reconcile feed
    interval: 1m
    input_series:
      - series: 'tg_parser_topicization_reconcile_discover_docs_total{channel_id="murashko_med"}'
        values: '0+5x200'
    alert_rule_test:
      - eval_time: 3h
        alertname: TopicizationReconcileDiscoverSustained
        exp_alerts:
          - exp_labels:
              severity: warning
              channel_id: murashko_med
            exp_annotations:
              summary: "Reconcile discover not converging (murashko_med)"
              description: "0.0833 docs/s fed to Phase-2 discover by the BUG-075 reconcile hook on channel murashko_med, sustained over 2h. Transient backlog-drain is expected to decay to 0 (at-most-one-discover marker); a sustained rate means reconcile is NOT converging — check the discover_attempted marker writes (R1 alert / processing_failures) and whether the channel's uncovered backlog keeps growing."

  # Reconcile NEGATIVE — a legitimate BURSTY, FINITE backlog-drain: +10/min for
  # 30 min (the at-most-once drain of ~300 docs) then FLAT. The increase ages out
  # of the [1h] rate window ~60 min after the last increment, so rate[1h] returns
  # to 0 well before the 2h debounce can mature → the alert must NOT fire. This is
  # the case the long window + 2h for: is designed to tolerate.
  - name: TopicizationReconcileDiscoverSustained stays silent on a finite backlog-drain burst
    interval: 1m
    input_series:
      - series: 'tg_parser_topicization_reconcile_discover_docs_total{channel_id="murashko_med"}'
        values: '0+10x30 300+0x210'
    alert_rule_test:
      - eval_time: 4h
        alertname: TopicizationReconcileDiscoverSustained
        exp_alerts: []

  # ==========================================================================
  # BUG-084 — embedding quota / rate-limit alerts
  # (group tg_parser_bug084_embedding_quota).
  # Metric: tg_embedding_requests_total{outcome, stage}. Both alerts share the
  # `sum(increase(...[15m])) > 0` for:30m shape (window < debounce for
  # single-blip robustness). Rules sum across stage, so the tests feed a single
  # stage series.
  # ==========================================================================

  # PRIMARY — sustained terminal quota exhaustion fires. +2/min continuous →
  # increase[15m] > 0 from the first window and never decays; for:30m matures at
  # ~30m; eval at 45m → firing. Uses stage=rag_query to prove the rule sums
  # across stage (no by(stage)).
  - name: EmbeddingQuotaExhausted fires on sustained terminal quota exhaustion
    interval: 1m
    input_series:
      - series: 'tg_embedding_requests_total{outcome="quota_exhausted",stage="rag_query"}'
        values: '0+2x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: EmbeddingQuotaExhausted
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Embedding requests terminally failing (OpenAI insufficient_quota) — BUG-084"
              description: "Embedding requests have been failing with terminal OpenAI insufficient_quota (outcome=quota_exhausted) sustained for 30m — semantic/hybrid RAG has degraded to keyword-only (BUG-084). This is a billing/tier state, NOT a code bug: add credits / raise the usage tier at platform.openai.com (see docs/runbooks/OPENAI_EMBEDDING_QUOTA_RECOVERY.md). Code cannot restore embeddings without the billing action."

  # PRIMARY negative (single blip) — proves the window<for robustness claim: a
  # short quota_exhausted burst (+2/min for 12m) then FLAT. increase[15m] stays
  # >0 only until ~27m (the last increment ages out at 12+15), well before the
  # 30m debounce matures → the alert must NOT fire. A lone transient
  # misclassification cannot page.
  - name: EmbeddingQuotaExhausted stays silent on a short quota blip
    interval: 1m
    input_series:
      - series: 'tg_embedding_requests_total{outcome="quota_exhausted",stage="rag_query"}'
        values: '0+2x12 24+0x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: EmbeddingQuotaExhausted
        exp_alerts: []

  # PRIMARY negative (no quota) — healthy + transient throttling only: ok and
  # rate_limited traffic, but NO quota_exhausted series at all → the summed
  # expr is an empty vector → the quota alert must stay silent (the outcome
  # filter isolates terminal quota from transient rate-limits).
  - name: EmbeddingQuotaExhausted stays silent when only ok and rate_limited traffic
    interval: 1m
    input_series:
      - series: 'tg_embedding_requests_total{outcome="ok",stage="rag_query"}'
        values: '0+10x60'
      - series: 'tg_embedding_requests_total{outcome="rate_limited",stage="background_topic"}'
        values: '0+2x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: EmbeddingQuotaExhausted
        exp_alerts: []

  # SECONDARY — sustained transient rate-limiting fires at info severity. +2/min
  # continuous on background_topic → increase[15m] > 0; for:30m matures at ~30m;
  # eval at 45m → firing. Also asserts the quota alert is silent in this scenario
  # (no quota_exhausted series) — the two outcomes are cleanly separated.
  - name: EmbeddingRateLimitedSustained fires on sustained transient throttling (info)
    interval: 1m
    input_series:
      - series: 'tg_embedding_requests_total{outcome="rate_limited",stage="background_topic"}'
        values: '0+2x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: EmbeddingRateLimitedSustained
        exp_alerts:
          - exp_labels:
              severity: info
            exp_annotations:
              summary: "Embedding requests sustained rate-limited (transient throttling) — BUG-084"
              description: "Embedding requests have been exhausting their retry budget on transient OpenAI rate_limit_exceeded / 5xx (outcome=rate_limited) sustained for 30m — semantic/hybrid RAG transiently degrades to keyword-only during throttling (BUG-084). Self-clears when throughput drops; if chronic, consider an embedding concurrency cap / usage-tier bump. Distinct from the terminal quota_exhausted case (EmbeddingQuotaExhausted)."
      - eval_time: 45m
        alertname: EmbeddingQuotaExhausted
        exp_alerts: []

  # SECONDARY negative — healthy ok-only traffic: no rate_limited series → the
  # rate-limit alert stays silent (an occasional successful embed must not fire).
  - name: EmbeddingRateLimitedSustained stays silent on healthy ok-only traffic
    interval: 1m
    input_series:
      - series: 'tg_embedding_requests_total{outcome="ok",stage="rag_query"}'
        values: '0+10x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: EmbeddingRateLimitedSustained
        exp_alerts: []

  # ==========================================================================
  # B1 / BUG-085 — IncrementalIngestionAllSourcesFailing
  # (group tg_parser_incremental_ingestion).
  # Metric: tg_parser_incremental_pipeline_sources_total{outcome}.
  # Shape: increase(failed[2h]) > 0 AND (increase(succeeded[2h]) or vector(0)) == 0
  # for:30m. Single-blip guard is the succeeded==0 conjunct (NOT window<for).
  # ==========================================================================

  # (a) FIRES — sustained hard-fail with zero successes. +1/min on failed,
  # succeeded flat at 0 → both conjuncts true from the first samples; for:30m
  # matures at ~30m; eval at 45m → firing. Cold-start / never-succeeded case
  # (see alerts.yml caveat): detection can be ~30m, not the steady-state
  # ~2–2.5h after a last success.
  - name: IncrementalIngestionAllSourcesFailing fires on sustained all-sources hard-fail
    interval: 1m
    input_series:
      - series: 'tg_parser_incremental_pipeline_sources_total{outcome="failed"}'
        values: '0+1x180'
      - series: 'tg_parser_incremental_pipeline_sources_total{outcome="succeeded"}'
        values: '0+0x180'
    alert_rule_test:
      - eval_time: 45m
        alertname: IncrementalIngestionAllSourcesFailing
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Incremental ingestion: every source failing, none succeeding"
              description: "All active sources failed HARD across the trailing 2h (≥2 ticks) with ZERO successes — an ingestion outage (e.g. the BUG-078-class TELEGRAM_SESSION_KEY / SessionCryptoError incident, prod 2026-07-16→17, fix 1fbc9b5). degraded ticks are excluded. Check tg_parser logs for 'Incremental pipeline completed: succeeded=0' + SessionCryptoError and the tg_parser compose env allow-list."

  # (b) SILENT (healthy) — both failed and succeeded grow → succeeded==0 false.
  - name: IncrementalIngestionAllSourcesFailing stays silent when sources also succeed
    interval: 1m
    input_series:
      - series: 'tg_parser_incremental_pipeline_sources_total{outcome="failed"}'
        values: '0+1x180'
      - series: 'tg_parser_incremental_pipeline_sources_total{outcome="succeeded"}'
        values: '0+5x180'
    alert_rule_test:
      - eval_time: 45m
        alertname: IncrementalIngestionAllSourcesFailing
        exp_alerts: []

  # (c) SILENT (degraded-only) — only outcome="degraded" grows; failed and
  # succeeded stay flat. Proves degraded is excluded from the alert condition
  # (a benign MsgIdInvalidError / billing tick must NOT page).
  - name: IncrementalIngestionAllSourcesFailing stays silent on degraded-only ticks
    interval: 1m
    input_series:
      - series: 'tg_parser_incremental_pipeline_sources_total{outcome="degraded"}'
        values: '0+1x180'
      - series: 'tg_parser_incremental_pipeline_sources_total{outcome="failed"}'
        values: '0+0x180'
      - series: 'tg_parser_incremental_pipeline_sources_total{outcome="succeeded"}'
        values: '0+0x180'
    alert_rule_test:
      - eval_time: 45m
        alertname: IncrementalIngestionAllSourcesFailing
        exp_alerts: []

  # (d) SILENT (single blip amid healthy ticks) — one failed spike, then flat,
  # WITH succeeded increments inside the trailing [2h] window. Silence comes
  # from the non-zero succeeded term (NOT from the failed blip aging out —
  # with [2h] a lone failed spike without succeeded would keep failed[2h]>0
  # for 2h ≫ for:30m and WOULD fire).
  - name: IncrementalIngestionAllSourcesFailing stays silent on single failed blip amid healthy ticks
    interval: 1m
    input_series:
      - series: 'tg_parser_incremental_pipeline_sources_total{outcome="failed"}'
        values: '0+1x5 5+0x175'
      - series: 'tg_parser_incremental_pipeline_sources_total{outcome="succeeded"}'
        values: '0+1x180'
    alert_rule_test:
      - eval_time: 45m
        alertname: IncrementalIngestionAllSourcesFailing
        exp_alerts: []

  # ==========================================================================
  # T7 / F5-C — ResummarizeLLMErrorRate (group tg_parser_alerts).
  # Metric: tg_resummarize_total{outcome}. Shape:
  #   rate(llm_error[30m]) / rate({outcome!="refusal_cooldown"}[30m]) > 0.2, for:30m
  #
  # The denominator exclusion is the whole point of case (b): outcome=
  # "refusal_cooldown" ticks are zero-cost skips that never reach the LLM
  # (BUG-083), so counting them as attempts dilutes the tripwire. Timing: a
  # [30m] rate window under for:30m needs ~60m before it can mature, so every
  # scenario feeds 120 samples at 1m and asserts at 90m.
  # ==========================================================================

  # (a) FIRES — one in four productive attempts fails. ok +6/min, llm_error
  # +2/min → 2/(6+2) = 0.25 > 0.2, sustained well past for:30m.
  - name: ResummarizeLLMErrorRate fires when a quarter of productive attempts fail
    interval: 1m
    input_series:
      - series: 'tg_resummarize_total{outcome="ok",channel_id="c1",trigger="counter"}'
        values: '0+6x120'
      - series: 'tg_resummarize_total{outcome="llm_error",channel_id="c1",trigger="counter"}'
        values: '0+2x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: ResummarizeLLMErrorRate
        exp_alerts:
          - exp_labels:
              severity: info
            exp_annotations:
              summary: "F5-C re-summarize LLM-error rate >20%"
              description: "25% of F5-C re-summarize attempts (excluding zero-cost refusal_cooldown skips) are failing with outcome=llm_error over 30m — check the resummarize LLM provider/credits."

  # (b) REGRESSION PIN for the 2026-08-11 denominator fix — identical productive
  # traffic to (a), plus a poison-pill topic emitting refusal_cooldown at
  # +24/min (BUG-083: one quarantined topic re-skipped every tick, forever).
  # NEW expression: 2/(6+2) = 0.25 → FIRES, because the free skips are excluded.
  # OLD expression (denominator over ALL outcomes): 2/(6+2+24) = 0.0625 → would
  # stay SILENT while a quarter of real attempts were failing. Reverting the
  # exclusion turns this case red, which is exactly what it is here to do.
  - name: ResummarizeLLMErrorRate still fires when refusal_cooldown skips flood the counter
    interval: 1m
    input_series:
      - series: 'tg_resummarize_total{outcome="ok",channel_id="c1",trigger="counter"}'
        values: '0+6x120'
      - series: 'tg_resummarize_total{outcome="llm_error",channel_id="c1",trigger="counter"}'
        values: '0+2x120'
      - series: 'tg_resummarize_total{outcome="refusal_cooldown",channel_id="c2",trigger="age"}'
        values: '0+24x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: ResummarizeLLMErrorRate
        exp_alerts:
          - exp_labels:
              severity: info
            exp_annotations:
              summary: "F5-C re-summarize LLM-error rate >20%"
              description: "25% of F5-C re-summarize attempts (excluding zero-cost refusal_cooldown skips) are failing with outcome=llm_error over 30m — check the resummarize LLM provider/credits."

  # (c) SILENT — healthy provider: ok +19/min against llm_error +1/min →
  # 1/20 = 0.05, an order of magnitude under the threshold. Guards the other
  # direction: the exclusion must not make the alert trigger-happy.
  - name: ResummarizeLLMErrorRate stays silent at a healthy error rate
    interval: 1m
    input_series:
      - series: 'tg_resummarize_total{outcome="ok",channel_id="c1",trigger="counter"}'
        values: '0+19x120'
      - series: 'tg_resummarize_total{outcome="llm_error",channel_id="c1",trigger="counter"}'
        values: '0+1x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: ResummarizeLLMErrorRate
        exp_alerts: []

  # (d) SILENT — the pure poison-pill state: nothing but refusal_cooldown skips,
  # llm_error present but flat. The exclusion empties the denominator, so the
  # ratio is 0/0 = NaN and NaN > 0.2 is false. Pins that excluding the only
  # traffic there is degrades to silence rather than to a divide-by-zero fire.
  # Staleness of a frozen topic is not this alert's job — that is
  # ResummarizeRefusalCooldownPoisonPill.
  - name: ResummarizeLLMErrorRate stays silent when only refusal_cooldown traffic exists
    interval: 1m
    input_series:
      - series: 'tg_resummarize_total{outcome="refusal_cooldown",channel_id="c2",trigger="age"}'
        values: '0+24x120'
      - series: 'tg_resummarize_total{outcome="llm_error",channel_id="c2",trigger="age"}'
        values: '0+0x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: ResummarizeLLMErrorRate
        exp_alerts: []
