# promtool unit tests for docker/prometheus/alerts.yml
#
# Focused on WatchlistSemanticUnavailableHigh (D1 / Wave-2 T6): the keyword-only
# (semantic-unavailable) share tripwire
#
#   sum(rate(tg_watchlist_semantic_unavailable_total[1h]))
#   / sum(rate(tg_watchlist_matches_total[1h])) > 0.5   for: 6h
#
# Run:  promtool test rules docker/prometheus/alerts_test.yml
#
# Timing note: the rule has for:6h on top of a [1h] rate window, so each
# scenario feeds ~7h of counter samples (interval 1m) and asserts at eval_time
# 7h — past the 6h debounce — so a firing alert has had time to mature.
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  # (a) HIGH-ratio: ~80% of scored matches degrade to keyword-only, sustained
  # well past the 6h for: debounce. Counters grow linearly (sem +8/min,
  # matches +10/min) so rate(sem[1h]) / rate(matches[1h]) = 8/10 = 0.8 > 0.5.
  # Asserts WatchlistSemanticUnavailableHigh is FIRING at 7h.
  - name: WatchlistSemanticUnavailableHigh fires on sustained >50% keyword-only share
    interval: 1m
    input_series:
      - series: 'tg_watchlist_semantic_unavailable_total{reason="no_doc_embedding"}'
        values: '0+8x420'
      - series: 'tg_watchlist_matches_total'
        values: '0+10x420'
    alert_rule_test:
      - eval_time: 7h
        alertname: WatchlistSemanticUnavailableHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "F11 watchlist keyword-only (semantic-unavailable) share >50%"
              description: "80% of scored watchlist matches degraded to keyword-only (no semantic signal) over 1h — interest or document embeddings are likely missing; check the embedding backfill. Distinct from blended tg_watchlist_score."

  # (b) LOW-ratio: ~0.83% keyword-only share (sem +1/min, matches +120/min →
  # 1/120 = 0.0083), matching the real ~0.83% measured fraction. Well under the
  # 0.5 threshold, so the alert must NOT fire even after 7h.
  - name: WatchlistSemanticUnavailableHigh stays silent at the real ~0.83% share
    interval: 1m
    input_series:
      - series: 'tg_watchlist_semantic_unavailable_total{reason="no_doc_embedding"}'
        values: '0+1x420'
      - series: 'tg_watchlist_matches_total'
        values: '0+120x420'
    alert_rule_test:
      - eval_time: 7h
        alertname: WatchlistSemanticUnavailableHigh
        exp_alerts: []

  # ==========================================================================
  # BUG-071 — topicization token-burn alerts (group tg_parser_bug071_topicization)
  # Thresholds derived from the prod incident (684 tok/s total, 236 tok/s
  # completion, 0.094 failed-batch/s, avg completion/call ~8097 ≈ 8192 cap).
  # ==========================================================================

  # P1 — moderate truncation rate (0.1/s) fires the warning Spike but NOT the
  # critical Burst (>0.2). +6/min → rate[5m] = 30/300 = 0.1/s. Spike for:15m
  # fires at 20m; eval at 30m (matured).
  - name: TopicizationTruncationSpike fires at moderate rate; Burst stays silent
    interval: 1m
    input_series:
      - series: 'tg_parser_llm_truncation_total{provider="anthropic",model="claude-sonnet-4-6",stage="topicization_generate"}'
        values: '0+6x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: TopicizationTruncationSpike
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Topicization max_tokens truncations sustained (>0.05/s)"
              description: "0.1 truncations/s over 5m for 15m — Fix-1 shrink ladder may not be converging; check prompt/batch size."
      - eval_time: 30m
        alertname: TopicizationTruncationBurst
        exp_alerts: []

  # P1b — high truncation rate (0.3/s) fires BOTH Burst (critical) and Spike
  # (warning). +18/min → rate[5m] = 90/300 = 0.3/s. Burst for:10m fires at 15m,
  # Spike for:15m fires at 20m; eval at 30m (both matured). discover stage proves
  # the rule is stage-agnostic (sum over all stages).
  - name: TopicizationTruncationBurst fires at high rate (also trips Spike)
    interval: 1m
    input_series:
      - series: 'tg_parser_llm_truncation_total{provider="anthropic",model="claude-sonnet-4-6",stage="topicization_discover"}'
        values: '0+18x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: TopicizationTruncationBurst
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Topicization truncation burst (~pre-fix failed-batch rate)"
              description: "0.3 truncations/s — at or above the pre-fix incident rate. Consider rollback / re-pause billing."
      - eval_time: 30m
        alertname: TopicizationTruncationSpike
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Topicization max_tokens truncations sustained (>0.05/s)"
              description: "0.3 truncations/s over 5m for 15m — Fix-1 shrink ladder may not be converging; check prompt/batch size."

  # P1/P1b negative — low truncation rate (~0.0167/s) trips neither. +1/min →
  # rate[5m] = 5/300 = 0.0167/s < 0.05.
  - name: Truncation alerts stay silent at a low truncation rate
    interval: 1m
    input_series:
      - series: 'tg_parser_llm_truncation_total{provider="anthropic",model="claude-sonnet-4-6",stage="topicization_generate"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: TopicizationTruncationSpike
        exp_alerts: []
      - eval_time: 30m
        alertname: TopicizationTruncationBurst
        exp_alerts: []

  # P2 — avg completion ÷ call = 8000 (near the 8192 cap) fires. completion
  # +8000/min, success requests +1/min → rate(completion[10m]) / rate(req[10m])
  # = (80000/600) / (10/600) = 8000 > 6000. for:15m fires at 25m; eval at 30m.
  - name: SonnetCompletionNearCap fires when avg completion approaches the cap
    interval: 1m
    input_series:
      - series: 'tg_parser_llm_tokens_total{provider="anthropic",model="claude-sonnet-4-6",token_type="completion"}'
        values: '0+8000x60'
      - series: 'tg_parser_llm_requests_total{provider="anthropic",model="claude-sonnet-4-6",status="success"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: SonnetCompletionNearCap
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Sonnet avg completion tokens/call approaching 8192 cap"
              description: "Avg 8000 completion tok/call over 10m (cap 8192, baseline-bad ~8097) — output routinely maxing out = truncation."

  # P2 negative — avg completion 2000/call (well below 6000) stays silent.
  - name: SonnetCompletionNearCap stays silent at a healthy avg completion size
    interval: 1m
    input_series:
      - series: 'tg_parser_llm_tokens_total{provider="anthropic",model="claude-sonnet-4-6",token_type="completion"}'
        values: '0+2000x60'
      - series: 'tg_parser_llm_requests_total{provider="anthropic",model="claude-sonnet-4-6",status="success"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: SonnetCompletionNearCap
        exp_alerts: []

  # P3 — burn-with-no-progress fires when topics_created_total EXISTS but is flat
  # (rate 0). completion +100000/min → rate[15m] = 1.5M/900 = 1666/s > 150;
  # topics flat → rate 0 → (==0) true. for:30m fires at 45m; eval at 50m.
  - name: TopicizationBurnNoProgress fires when tokens burn and topics are flat
    interval: 1m
    input_series:
      - series: 'tg_parser_llm_tokens_total{provider="anthropic",model="claude-sonnet-4-6",token_type="completion"}'
        values: '0+100000x70'
      - series: 'tg_parser_topics_created_total{channel_id="murashko_med"}'
        values: '0+0x70'
    alert_rule_test:
      - eval_time: 50m
        alertname: TopicizationBurnNoProgress
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Sonnet tokens burning but 0 topic cards created"
              description: "Completion-token rate high while topics_created flat for 30m — the BUG-071 burn-without-progress signature."

  # P3 — the `or vector(0)` scenario: topics_created_total has NO series at all
  # (no card ever created). Without `or vector(0)` the `== 0` term would be an
  # empty vector and the alert could never fire — this proves it DOES fire.
  - name: TopicizationBurnNoProgress fires when topics_created series is ABSENT (or vector(0))
    interval: 1m
    input_series:
      - series: 'tg_parser_llm_tokens_total{provider="anthropic",model="claude-sonnet-4-6",token_type="completion"}'
        values: '0+100000x70'
    alert_rule_test:
      - eval_time: 50m
        alertname: TopicizationBurnNoProgress
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Sonnet tokens burning but 0 topic cards created"
              description: "Completion-token rate high while topics_created flat for 30m — the BUG-071 burn-without-progress signature."

  # P3 negative — tokens burning BUT topics_created is also advancing (rate > 0),
  # so the burn IS making progress → must NOT fire.
  - name: TopicizationBurnNoProgress stays silent when topics are being created
    interval: 1m
    input_series:
      - series: 'tg_parser_llm_tokens_total{provider="anthropic",model="claude-sonnet-4-6",token_type="completion"}'
        values: '0+100000x70'
      - series: 'tg_parser_topics_created_total{channel_id="murashko_med"}'
        values: '0+5x70'
    alert_rule_test:
      - eval_time: 50m
        alertname: TopicizationBurnNoProgress
        exp_alerts: []

  # P3b — direct failed-batch signal fires. +6/min on the generate stage →
  # rate[15m] = 90/900 = 0.1/s > 0.05. for:15m fires at ~17m; eval at 35m.
  # exp_labels carries the by(stage) label.
  - name: TopicizationFailedBatchesHigh fires on a sustained failed-batch rate
    interval: 1m
    input_series:
      - series: 'tg_parser_topicization_failed_batches_total{stage="topicization_generate",channel_id="murashko_med"}'
        values: '0+6x60'
    alert_rule_test:
      - eval_time: 35m
        alertname: TopicizationFailedBatchesHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              stage: topicization_generate
            exp_annotations:
              summary: "Topicization failed-batch rate high (topicization_generate)"
              description: "0.100 failed batches/s on stage topicization_generate over 15m — batches producing 0 usable topics (truncation-drops or hard errors). Drill down by channel_id on tg_parser_topicization_failed_batches_total."

  # P3b negative — low failed-batch rate (+1/min → 15/900 = 0.0167/s < 0.05) is
  # silent (e.g. an occasional drop that the Fix-1 shrink ladder recovers from).
  - name: TopicizationFailedBatchesHigh stays silent at a low failed-batch rate
    interval: 1m
    input_series:
      - series: 'tg_parser_topicization_failed_batches_total{stage="topicization_generate",channel_id="murashko_med"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 35m
        alertname: TopicizationFailedBatchesHigh
        exp_alerts: []

  # P4 — billing block still occurring after top-up fires. +6/min →
  # rate[10m] = 60/600 = 0.1/s > 0. for:15m fires at 25m; eval at 30m.
  - name: AnthropicBillingStillBlocked fires while billing blocks persist
    interval: 1m
    input_series:
      - series: 'tg_parser_anthropic_billing_block_total{stage="processing"}'
        values: '0+6x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: AnthropicBillingStillBlocked
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Anthropic billing blocks still occurring after top-up"
              description: "Top-up may not be effective / wrong key — processing won't drain."

  # P4 negative — no new billing blocks (flat counter) → rate 0 → silent.
  - name: AnthropicBillingStillBlocked stays silent when billing is unblocked
    interval: 1m
    input_series:
      - series: 'tg_parser_anthropic_billing_block_total{stage="processing"}'
        values: '0+0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: AnthropicBillingStillBlocked
        exp_alerts: []

  # ==========================================================================
  # BUG-072/073/074/075 + R1 — post-refill re-burn alerts
  # (group tg_parser_bug075_reconcile_postrefill, added 2026-06-30).
  # ==========================================================================

  # R1 — discover_attempted marker-write failures fire. +2/min on one channel →
  # rate[15m] = 30/900 = 0.0333/s > 0. for:15m fires at ~17m; eval at 35m.
  # exp_labels carries the by(channel_id) label. Healthy steady state is EXACTLY
  # 0, so the threshold is a bare `> 0`.
  - name: TopicizationDiscoverMarkerWriteFailing fires on persistent marker-write failures
    interval: 1m
    input_series:
      - series: 'tg_parser_topicization_discover_attempted_mark_failed_total{channel_id="murashko_med"}'
        values: '0+2x60'
    alert_rule_test:
      - eval_time: 35m
        alertname: TopicizationDiscoverMarkerWriteFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              channel_id: murashko_med
            exp_annotations:
              summary: "Reconcile discover_attempted marker writes failing (murashko_med)"
              description: "0.033 marker-write failures/s on channel murashko_med over 15m (R1). Docs that completed a Phase-2 discover are NOT being marked → re-fed next tick → bounded re-burn. Check the processing_failures repo / DB write path for this channel."

  # R1 negative — healthy: marker writes never fail (flat counter) → rate 0 →
  # silent (the expected steady state).
  - name: TopicizationDiscoverMarkerWriteFailing stays silent when markers persist
    interval: 1m
    input_series:
      - series: 'tg_parser_topicization_discover_attempted_mark_failed_total{channel_id="murashko_med"}'
        values: '0+0x60'
    alert_rule_test:
      - eval_time: 35m
        alertname: TopicizationDiscoverMarkerWriteFailing
        exp_alerts: []

  # BUG-074 — JSON-parse-retry spike fires. +6/min on the discover stage →
  # rate[15m] = 90/900 = 0.1/s > 0.05. for:15m fires at ~17m; eval at 35m. The
  # discover stage proves the rule covers merge/discover (not just generate,
  # which TopicizationFailedBatchesHigh already sees).
  - name: TopicizationJsonRepairRetrySpike fires on a sustained topicization retry rate
    interval: 1m
    input_series:
      - series: 'tg_parser_llm_json_parse_retry_total{stage="topicization_discover"}'
        values: '0+6x60'
    alert_rule_test:
      - eval_time: 35m
        alertname: TopicizationJsonRepairRetrySpike
        exp_alerts:
          - exp_labels:
              severity: warning
              stage: topicization_discover
            exp_annotations:
              summary: "Topicization JSON-parse-retry rate high (topicization_discover)"
              description: "0.100 JSON-parse retries/s on stage topicization_discover over 15m. After BUG-074 repair_json should parse malformed replies on the first attempt — a sustained rate means repair is missing the class and the batch prompt is being re-issued (charged re-burn). Inspect a sample reply."

  # BUG-074 negative (low rate) — +1/min → rate[15m] = 15/900 = 0.0167/s < 0.05
  # → silent (an occasional repair miss the reduced cap absorbs).
  - name: TopicizationJsonRepairRetrySpike stays silent at a low retry rate
    interval: 1m
    input_series:
      - series: 'tg_parser_llm_json_parse_retry_total{stage="topicization_generate"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 35m
        alertname: TopicizationJsonRepairRetrySpike
        exp_alerts: []

  # BUG-074 negative (wrong stage) — the per-message processing path is EXCLUDED
  # by the topicization_.* matcher. A high processing-stage retry rate (+6/min)
  # must NOT fire this topicization rule.
  - name: TopicizationJsonRepairRetrySpike ignores the per-message processing stage
    interval: 1m
    input_series:
      - series: 'tg_parser_llm_json_parse_retry_total{stage="processing"}'
        values: '0+6x60'
    alert_rule_test:
      - eval_time: 35m
        alertname: TopicizationJsonRepairRetrySpike
        exp_alerts: []

  # Reconcile re-burn (non-convergence) — SUSTAINED reconcile-discover feed fires.
  # +5/min CONTINUOUS → rate[1h] = 300/3600 = 0.0833/s, never decays to 0. The
  # condition is true from the first minute; for:2h matures at ~2h, so eval at 3h
  # is firing. exp_labels carries the by(channel_id) label. This models the red
  # flag: reconcile issuing discover calls that never stop.
  - name: TopicizationReconcileDiscoverSustained fires on a non-converging reconcile feed
    interval: 1m
    input_series:
      - series: 'tg_parser_topicization_reconcile_discover_docs_total{channel_id="murashko_med"}'
        values: '0+5x200'
    alert_rule_test:
      - eval_time: 3h
        alertname: TopicizationReconcileDiscoverSustained
        exp_alerts:
          - exp_labels:
              severity: warning
              channel_id: murashko_med
            exp_annotations:
              summary: "Reconcile discover not converging (murashko_med)"
              description: "0.0833 docs/s fed to Phase-2 discover by the BUG-075 reconcile hook on channel murashko_med, sustained over 2h. Transient backlog-drain is expected to decay to 0 (at-most-one-discover marker); a sustained rate means reconcile is NOT converging — check the discover_attempted marker writes (R1 alert / processing_failures) and whether the channel's uncovered backlog keeps growing."

  # Reconcile NEGATIVE — a legitimate BURSTY, FINITE backlog-drain: +10/min for
  # 30 min (the at-most-once drain of ~300 docs) then FLAT. The increase ages out
  # of the [1h] rate window ~60 min after the last increment, so rate[1h] returns
  # to 0 well before the 2h debounce can mature → the alert must NOT fire. This is
  # the case the long window + 2h for: is designed to tolerate.
  - name: TopicizationReconcileDiscoverSustained stays silent on a finite backlog-drain burst
    interval: 1m
    input_series:
      - series: 'tg_parser_topicization_reconcile_discover_docs_total{channel_id="murashko_med"}'
        values: '0+10x30 300+0x210'
    alert_rule_test:
      - eval_time: 4h
        alertname: TopicizationReconcileDiscoverSustained
        exp_alerts: []
