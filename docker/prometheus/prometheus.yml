global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Explicit filename, NOT a glob: this directory also holds alerts_test.yml
# (promtool unit tests), which is not a rule file and would fail to load.
rule_files:
  - "/etc/prometheus/conf/alerts.yml"

scrape_configs:
  - job_name: "tg_parser_api"
    metrics_path: /metrics
    static_configs:
      - targets: ["tg_parser:8000"]
        labels:
          service: "api"

  - job_name: "tg_parser_mcp"
    metrics_path: /metrics
    static_configs:
      - targets: ["mcp:8080"]
        labels:
          service: "mcp"

  # TD-bot-prometheus-scrape (#53): tg_bot exports its asyncio /metrics
  # endpoint on 8081 (same port as Docker healthcheck /health). Required
  # for tg_bot_gemini_empty_parts_total (Session E / BUG-006) post-deploy
  # watch via Prometheus query path.
  - job_name: "tg_parser_bot"
    metrics_path: /metrics
    static_configs:
      - targets: ["tg_bot:8081"]
        labels:
          service: "bot"
