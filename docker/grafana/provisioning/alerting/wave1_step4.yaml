# BUG-036 — Wave 1 step 4 Grafana alert rules provisioned as code.
#
# WHY THIS FILE EXISTS
# --------------------
# These three alert rules (`tg_parser_bot_down`, `tg_parser_api_down`,
# `tg_api_5xx_spike`) were originally created by hand in the Grafana UI during
# the Wave-1-step-4 VPS watch. UI-created rules do NOT persist their
# `noDataState` reliably across Grafana eval cycles / container restarts, so
# the `noDataState` kept drifting back to `Alerting/NoData` and re-emitted
# spurious `DatasourceNoData` webhook issues (fingerprint 47991b0914dd7148,
# GitHub issues #96/#98/#100/#101/#102/#103/#104). Provisioning them as code
# with an explicit `noDataState: OK` makes the state authoritative and
# restart-idempotent — Grafana re-applies this file on every start.
#
# This directory (./docker/grafana/provisioning) is bind-mounted read-only to
# /etc/grafana/provisioning:ro (see docker-compose.yml `grafana` service), so
# Grafana auto-loads this file on boot.
#
# SECRETS / ENV VARS — DECOMMISSIONED 2026-06-15 (#149 / BUG-037)
# ---------------------------------------------------------------
# The Cursor-webhook contact point that consumed GRAFANA_WEBHOOK_URL /
# GRAFANA_WEBHOOK_TOKEN was retired (see the notification-routing block at the
# bottom of this file). Those env vars are now UNUSED by this provisioning:
# the root route delivers to a self-contained loopback no-op sink instead, so
# no secrets are required and no alert is forwarded to GitHub. The harmless
# loopback defaults still declared in docker-compose.yml (`grafana` service)
# can be left as-is; they are no longer referenced here.
#
# METRIC-NAME ASSUMPTION (documented per BUG-036 deliverable)
# ----------------------------------------------------------
# The Wave-1-step-4 operator runbook
# (docs/runbooks/WAVE1_STEP4_VPS_OPERATOR_MANUAL_ACTIONS.md) listed the 5xx
# expr as `sum(rate(tg_api_requests_total{path=~...,status=~"5.."}[5m])) > 0`.
# That metric/label pair does NOT exist in this codebase. The real HTTP
# request counter is `tg_parser_http_requests_total` (emitted by
# prometheus-fastapi-instrumentator with namespace `tg_parser`/subsystem
# `http`; see tg_parser/api/metrics.py + docker/grafana/dashboards/system.json
# which queries `tg_parser_http_requests_total{status=~"4..|5.."}`). The path
# is exposed via the `handler` label (templated route), not `path`. The 5xx
# expr below uses the real metric/labels. The `up{job=...}` exprs match the
# Prometheus scrape jobs declared in docker/prometheus.yml.
#
# BUG-060 — FUTURE watchlist-score alerts MUST gate on `semantic_available`
# ------------------------------------------------------------------------
# There is intentionally NO watchlist-score alert rule in this file (the
# `tg_watchlist_score` histogram). Before adding one: that histogram mixes
# keyword-only and hybrid rows. When `semantic_available=False`, a row is by
# design `combined=keyword` with `semantic=0.0` (ADR-0010/0011). ANY future
# alert expression that assumes the blended `kw_weight·keyword +
# sem_weight·semantic` formula (defaults 0.4/0.6) MUST gate on
# `semantic_available` (or exclude keyword-only rows), otherwise keyword-only
# rows with `semantic=0.0` will trigger false positives. See BUG-060 in
# docs/notes/WAVE1_TECH_DEBT.md § B and the watchlist-score PromQL warning in
# docs/runbooks/F5C_DEPLOY_AND_WATCH.md. This is a guide comment only — do NOT
# add the rule here without the gate (deferred "full" follow-up).

apiVersion: 1

# ---------------------------------------------------------------------------
# Alert rule groups
# ---------------------------------------------------------------------------
groups:
  - orgId: 1
    name: wave1_step4_watch
    folder: wave1-step4-watch
    # Group evaluation cadence. `for: 5m` below means a condition must hold for
    # 5 minutes (>= 5 eval ticks at 1m) before the rule transitions to firing.
    interval: 1m
    rules:
      # -- Rule 1: bot process down -------------------------------------------
      # Fires when the tg_bot Prometheus scrape target reports up == 0 for 5m.
      # `up` is 0 when the target is configured but unreachable; it is ENTIRELY
      # ABSENT only if the scrape job is removed — that absence maps to NoData,
      # which `noDataState: OK` deliberately suppresses (no spurious webhook).
      - uid: bug036_tg_parser_bot_down
        title: tg_parser_bot_down
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "tg_parser bot is down"
          description: "Prometheus scrape target job=tg_parser_bot has reported up==0 for 5m."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: up{job="tg_parser_bot"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              conditions:
                - type: query
                  evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []

      # -- Rule 2: API service down -------------------------------------------
      - uid: bug036_tg_parser_api_down
        title: tg_parser_api_down
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "tg_parser API is down"
          description: "Prometheus scrape target job=tg_parser_api has reported up==0 for 5m."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: up{job="tg_parser_api"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              conditions:
                - type: query
                  evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []

      # -- Rule 3: 5xx spike (REMOVED 2026-06-15, BUG-038 / #149) -------------
      # The `tg_api_5xx_spike` rule was dropped because it never matched real
      # 5xx data on the live VPS (stale metric name lineage — BUG-038) and only
      # ever emitted DatasourceNoData / DatasourceError noise, which the
      # decommissioned Cursor webhook ingress (#149) turned into ~one orphan
      # GitHub issue every repeat_interval. Do NOT re-add without a verified
      # query against `tg_parser_http_requests_total{...,status=~"5.."}` AND a
      # non-issue notification channel (see #149 / BUG-037 / BUG-038).

# ---------------------------------------------------------------------------
# Notification routing — DECOMMISSIONED 2026-06-15 (#149 / BUG-037).
#
# The Wave-1-step-4 watch window is closed (Wave 1 closed 2026-06-06). The
# `cursor-watch-webhook` contact point (a webhook to the Cursor cloud
# automation `7b35ca01-…` that opened a GitHub issue per alert fire, plus
# orphan permission/connectivity probe issues) has been retired: monitoring
# alerts must NOT create GitHub issues.
#
# A root policy MUST still exist for provisioning to be valid, so the root
# route points to a self-contained no-op sink (`noop-null`, a webhook to a
# loopback dead port). The surviving rules (`tg_parser_bot_down`,
# `tg_parser_api_down`) keep evaluating and remain visible as alert state in
# the Grafana UI / dashboards; they simply do not notify any external channel.
#
# NOTE: provisioning `policies` replaces the root notification policy tree.
# There is no other policy-provisioning file in this repo, so this is safe.
# ---------------------------------------------------------------------------
contactPoints:
  - orgId: 1
    name: noop-null
    receivers:
      - uid: noop_null_decommissioned_ingress
        type: webhook
        disableResolveMessage: true
        settings:
          url: http://127.0.0.1:65535/
          httpMethod: POST

policies:
  - orgId: 1
    receiver: noop-null
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
