# Per-DB alembic config (DI-7) — branch: ingestion.
# Generated convention; do not edit ad-hoc. See `migrations/alembic.ini` for shared base.
#
# Direct invocation:
#   alembic -c migrations/alembic_ingestion.ini -x db_name=ingestion <cmd>
# CLI wrapper (preferred):
#   tg-parser db <cmd> --db ingestion

[alembic]
# Template used to generate migration files
script_location = migrations

# Template used to generate migration file names; default is "%%(rev)s_%%(slug)s"
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone to use when rendering the date within the migration file
# Leave empty for localtime
# timezone =

# Max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a source .py file
# sourceless = false

# Single-branch version_locations (DI-7): scopes alembic to one logical DB so that
# `heads`/`check`/`current` (which build ScriptDirectory before env.py runs)
# don't see all three branches at once and fail with "Multiple head revisions".
version_locations = migrations/versions/ingestion

# Version path separator; default is "os"
# version_path_separator = os

# The output encoding used when revision files are written
# output_encoding = utf-8

# Multi-database wiring lives in `migrations/env.py`:
# - Connection URL is built at runtime by `env.py::get_url()` from `Settings()`
#   (DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD env vars) or from the
#   `ALEMBIC_DATABASE_URL` env override.
# - Branch selection (`ingestion` / `raw` / `processing`) flows in via
#   `-x db_name=<branch>` (set automatically by `tg_parser/cli/db_cmd.py`
#   and `tg_parser/cli/init_db.py` when invoking alembic per-DB).

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
