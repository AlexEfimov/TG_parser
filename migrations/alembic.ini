# Alembic configuration for TG_parser multi-database setup
# Session 22: Foundation & Tech Debt
# Sprint A.5 / DI-7 (19 апреля 2026): per-branch operations now use the static
# per-DB ini files (`alembic_ingestion.ini`, `alembic_raw.ini`,
# `alembic_processing.ini`) rather than a runtime tempfile generated from this
# file. This file is kept as the shared base / project-root sentinel.
#
# ⚠️  DO NOT use this file with `alembic -c migrations/alembic.ini` directly.
# It declares `version_locations` for all three branches at once, so any command
# that builds `ScriptDirectory` before `env.py` runs (heads / check / current /
# upgrade head / downgrade base / etc.) will fail with:
#     "Multiple head revisions are present for given argument 'head'"
# Always go through one of:
#   • `tg-parser db <cmd> --db <branch>`   (preferred — tg_parser/cli/db_cmd.py)
#   • `alembic -c migrations/alembic_<branch>.ini -x db_name=<branch> <cmd>`
# See `docs/runbooks/DEV_RESURRECTION.md` and FUTURE_FEATURES.md DI-7.

[alembic]
# Template used to generate migration files
script_location = migrations

# Template used to generate migration file names; default is "%%(rev)s_%%(slug)s"
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone to use when rendering the date within the migration file
# Leave empty for localtime
# timezone =

# Max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a source .py file
# sourceless = false

# Aggregate version_locations across all three logical branches. Listed for
# documentation/discoverability only — see warning above; per-branch alembic
# operations route through `migrations/alembic_<branch>.ini` (DI-7).
version_locations = migrations/versions/ingestion migrations/versions/raw migrations/versions/processing

# Version path separator; default is "os"
# version_path_separator = os

# The output encoding used when revision files are written
# output_encoding = utf-8

# Multi-database configuration
# Three logical branches (ingestion / raw / processing) historically had per-branch
# `[<branch>]` sections with `sqlalchemy.url = sqlite:///...`. Those are now obsolete
# (PostgreSQL-only since Session 39, multi-DB wiring lives in `migrations/env.py`):
#
# - The connection URL is built at runtime by `env.py::get_url()` from
#   `Settings()` (DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD env vars) or from the
#   `ALEMBIC_DATABASE_URL` env override.
# - Branch selection (`ingestion` / `raw` / `processing`) is encoded in the
#   per-DB ini file (`alembic_<branch>.ini`) and forwarded via
#   `-x db_name=<branch>` (DI-7).
#
# DO NOT add `[ingestion]/[raw]/[processing]` sqlalchemy.url sections back here —
# they are silently ignored and only confuse new contributors.

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

