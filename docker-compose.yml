services:
  # PostgreSQL 17 + pgvector
  postgres:
    image: pgvector/pgvector:pg17
    container_name: tg_parser_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-tg_parser}
      POSTGRES_USER: ${DB_USER:-tg_parser_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password required}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tg_parser_user} -d ${DB_NAME:-tg_parser}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - tg_parser_network

  # TG_parser API + Background Scheduler
  tg_parser:
    build:
      context: .
      dockerfile: Dockerfile
    image: tg_parser:latest
    container_name: tg_parser
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
      - ./prompts:/app/prompts:ro
      # Telegram session persistence (directory bind mount, not file)
      - ./data/sessions:/app/sessions
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # Database
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-tg_parser}
      - DB_USER=${DB_USER:-tg_parser_user}
      - DB_PASSWORD=${DB_PASSWORD:?Database password required}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-10}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
      - DB_POOL_RECYCLE=${DB_POOL_RECYCLE:-3600}
      - DB_POOL_PRE_PING=${DB_POOL_PRE_PING:-true}
      # LLM
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      # Telegram
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_PHONE=${TELEGRAM_PHONE}
      - TELEGRAM_SESSION_NAME=${TELEGRAM_SESSION_NAME:-/app/sessions/tg_parser_session}
      # Logging
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    # Default CMD from Dockerfile: api --host 0.0.0.0 --port 8000
    # Override for one-shot commands: docker compose run tg_parser <command>
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    restart: unless-stopped
    networks:
      - tg_parser_network

  # MCP Server (Streamable HTTP for AI agents)
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: tg_parser:latest
    container_name: tg_parser_mcp
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
      - ./prompts:/app/prompts:ro
    ports:
      - "${MCP_PORT:-8080}:8080"
    environment:
      # Database
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-tg_parser}
      - DB_USER=${DB_USER:-tg_parser_user}
      - DB_PASSWORD=${DB_PASSWORD:?Database password required}
      # LLM
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # MCP
      - MCP_TRANSPORT=streamable-http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8080
      - MCP_AUTH_ENABLED=${MCP_AUTH_ENABLED:-false}
      - MCP_AUTH_TOKENS=${MCP_AUTH_TOKENS:-{}}
      # Logging
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    command: ["mcp", "--transport", "streamable-http"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.create_connection(('localhost',8080),timeout=5); s.close()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - tg_parser_network

  # Optional: Ollama service for local LLM
  ollama:
    image: ollama/ollama:latest
    container_name: tg_parser_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - tg_parser_network
    profiles:
      - ollama
    # Uncomment to enable GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  postgres_data:
    external: true
    name: tg_parser_pgvector17_data
  ollama_data:
    name: tg_parser_ollama_data

networks:
  tg_parser_network:
    name: tg_parser_network
    driver: bridge
