services:
  # PostgreSQL 17 + pgvector
  postgres:
    image: pgvector/pgvector:pg17
    container_name: tg_parser_postgres
    # F8-A: max_connections tuned for current stack — see README.md
    # § "Database tuning — max_connections formula" before changing this value
    # or before adding a new service that connects to Postgres.
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    environment:
      POSTGRES_DB: ${DB_NAME:-tg_parser}
      POSTGRES_USER: ${DB_USER:-tg_parser_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password required}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tg_parser_user} -d ${DB_NAME:-tg_parser}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - tg_parser_network

  # TG_parser API + Background Scheduler
  tg_parser:
    build:
      context: .
      dockerfile: Dockerfile
    image: tg_parser:latest
    container_name: tg_parser
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
      - ./prompts:/app/prompts:ro
      # Telegram session persistence (directory bind mount, not file)
      - ./data/sessions:/app/sessions
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      # Database — DB_HOST hardcoded to compose service name; host-side `.env`
      # may set DB_HOST=localhost for `tg-parser db ...` CLI runs against the
      # published 127.0.0.1:5432 port, but inside the container the only
      # reachable Postgres is `postgres` on the bridge network.
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-tg_parser}
      - DB_USER=${DB_USER:-tg_parser_user}
      - DB_PASSWORD=${DB_PASSWORD:?Database password required}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-10}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
      - DB_POOL_RECYCLE=${DB_POOL_RECYCLE:-3600}
      - DB_POOL_PRE_PING=${DB_POOL_PRE_PING:-true}
      # LLM
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-}
      - PROCESSING_LLM_PROVIDER=${PROCESSING_LLM_PROVIDER:-}
      - PROCESSING_LLM_MODEL=${PROCESSING_LLM_MODEL:-}
      - TOPICIZATION_LLM_PROVIDER=${TOPICIZATION_LLM_PROVIDER:-}
      - TOPICIZATION_LLM_MODEL=${TOPICIZATION_LLM_MODEL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      # Telegram
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_PHONE=${TELEGRAM_PHONE}
      - TELEGRAM_SESSION_NAME=${TELEGRAM_SESSION_NAME:-/app/sessions/tg_parser_session}
      # Security
      - API_KEY_REQUIRED=${API_KEY_REQUIRED:-false}
      - API_KEYS=${API_KEYS:-{}}
      - MCP_AUTH_ENABLED=${MCP_AUTH_ENABLED:-false}
      - MCP_AUTH_TOKENS=${MCP_AUTH_TOKENS:-{}}
      - BOT_ALLOWED_USERS=${BOT_ALLOWED_USERS:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-["*"]}
      # Logging
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    # Default CMD from Dockerfile: api --host 0.0.0.0 --port 8000
    # Override for one-shot commands: docker compose run tg_parser <command>
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    restart: unless-stopped
    networks:
      - tg_parser_network

  # MCP Server (Streamable HTTP for AI agents)
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: tg_parser:latest
    container_name: tg_parser_mcp
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
      - ./prompts:/app/prompts:ro
    ports:
      - "127.0.0.1:${MCP_PORT:-8080}:8080"
    environment:
      # Database — see tg_parser service for rationale (DB_HOST hardcoded).
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-tg_parser}
      - DB_USER=${DB_USER:-tg_parser_user}
      - DB_PASSWORD=${DB_PASSWORD:?Database password required}
      # LLM — full key trio + per-stage routing so RAG (ask_question) can
      # reach providers other than the default LLM_PROVIDER (DI-17).
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-}
      - RAG_LLM_PROVIDER=${RAG_LLM_PROVIDER:-}
      - RAG_LLM_MODEL=${RAG_LLM_MODEL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # Embedding (search_knowledge_base / ask_question)
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openai}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      # MCP
      - MCP_TRANSPORT=streamable-http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8080
      - MCP_AUTH_ENABLED=${MCP_AUTH_ENABLED:-false}
      - MCP_AUTH_TOKENS=${MCP_AUTH_TOKENS:-{}}
      # Logging
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    command: ["mcp", "--transport", "streamable-http"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - tg_parser_network

  # Telegram Bot (Phase 3 — Gemini agent)
  tg_bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: tg_parser:latest
    container_name: tg_parser_bot
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
      - ./prompts:/app/prompts:ro
    environment:
      # Database — see tg_parser service for rationale (DB_HOST hardcoded).
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-tg_parser}
      - DB_USER=${DB_USER:-tg_parser_user}
      - DB_PASSWORD=${DB_PASSWORD:?Database password required}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-3}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-5}
      # LLM — all three API keys (Gemini for agent, Anthropic for RAG if configured, OpenAI for embeddings)
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-}
      - PROCESSING_LLM_PROVIDER=${PROCESSING_LLM_PROVIDER:-}
      - PROCESSING_LLM_MODEL=${PROCESSING_LLM_MODEL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # Embedding (for search/RAG — uses OpenAI embeddings by default)
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openai}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      # Bot configuration
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - BOT_ALLOWED_USERS=${BOT_ALLOWED_USERS:-}
      - BOT_REQUEST_TIMEOUT=${BOT_REQUEST_TIMEOUT:-60}
      - BOT_RATE_LIMIT=${BOT_RATE_LIMIT:-10}
      - BOT_GEMINI_MODEL=${BOT_GEMINI_MODEL:-gemini-2.5-flash}
      # Logging
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    command: ["bot"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    stop_grace_period: 15s
    restart: unless-stopped
    networks:
      - tg_parser_network
    profiles:
      - bot

  # Caddy Reverse Proxy + TLS
  caddy:
    image: caddy:2-alpine
    container_name: tg_parser_caddy
    depends_on:
      tg_parser:
        condition: service_healthy
      mcp:
        condition: service_healthy
      grafana:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      - DOMAIN_MCP=${DOMAIN_MCP:-mcp.localhost}
      - DOMAIN_API=${DOMAIN_API:-api.localhost}
      - DOMAIN_GRAFANA=${DOMAIN_GRAFANA:-grafana.localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - tg_parser_network
    profiles:
      - production

  # Prometheus monitoring
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: tg_parser_prometheus
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    restart: unless-stopped
    networks:
      - tg_parser_network

  # Grafana dashboards
  grafana:
    image: grafana/grafana:11.1.0
    container_name: tg_parser_grafana
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped
    networks:
      - tg_parser_network

  # Optional: Ollama service for local LLM
  ollama:
    image: ollama/ollama:latest
    container_name: tg_parser_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - tg_parser_network
    profiles:
      - ollama
    # Uncomment to enable GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  postgres_data:
    external: true
    name: tg_parser_pgvector17_data
  ollama_data:
    name: tg_parser_ollama_data
  caddy_data:
    name: tg_parser_caddy_data
  caddy_config:
    name: tg_parser_caddy_config
  prometheus_data:
    name: tg_parser_prometheus_data
  grafana_data:
    name: tg_parser_grafana_data

networks:
  tg_parser_network:
    name: tg_parser_network
    driver: bridge
