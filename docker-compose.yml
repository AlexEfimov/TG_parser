services:
  # PostgreSQL 17 + pgvector
  postgres:
    image: pgvector/pgvector:pg17
    container_name: tg_parser_postgres
    # F8-A: max_connections tuned for current stack — see README.md
    # § "Database tuning — max_connections formula" before changing this value
    # or before adding a new service that connects to Postgres.
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    environment:
      POSTGRES_DB: ${DB_NAME:-tg_parser}
      POSTGRES_USER: ${DB_USER:-tg_parser_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password required}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tg_parser_user} -d ${DB_NAME:-tg_parser}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - tg_parser_network

  # TG_parser API + Background Scheduler
  tg_parser:
    build:
      context: .
      dockerfile: Dockerfile
    image: tg_parser:latest
    container_name: tg_parser
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./prompts:/app/prompts:ro
      # Telegram session persistence (directory bind mount, not file)
      - ./data/sessions:/app/sessions
      # `tg-parser db backup` writes here. Without this mount the CLI default
      # would resolve inside the container's writable layer and dumps would be
      # lost on the next recreate. Host side is overridable per deployment:
      # on redboxtgbot the project root lives on the small system partition, so
      # .env sets TG_PARSER_BACKUP_HOST_DIR=/mnt/data/backups/tg_parser/nightly.
      - ${TG_PARSER_BACKUP_HOST_DIR:-./data/backups}:/app/backups
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      # Path as seen from inside the container; the host path it maps to is
      # TG_PARSER_BACKUP_HOST_DIR above.
      - TG_PARSER_BACKUP_DIR=/app/backups
      # Database — DB_HOST hardcoded to compose service name; host-side `.env`
      # may set DB_HOST=localhost for `tg-parser db ...` CLI runs against the
      # published 127.0.0.1:5432 port, but inside the container the only
      # reachable Postgres is `postgres` on the bridge network.
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-tg_parser}
      - DB_USER=${DB_USER:-tg_parser_user}
      - DB_PASSWORD=${DB_PASSWORD:?Database password required}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-10}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
      - DB_POOL_RECYCLE=${DB_POOL_RECYCLE:-3600}
      - DB_POOL_PRE_PING=${DB_POOL_PRE_PING:-true}
      # LLM
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-}
      - PROCESSING_LLM_PROVIDER=${PROCESSING_LLM_PROVIDER:-}
      - PROCESSING_LLM_MODEL=${PROCESSING_LLM_MODEL:-}
      - TOPICIZATION_LLM_PROVIDER=${TOPICIZATION_LLM_PROVIDER:-}
      - TOPICIZATION_LLM_MODEL=${TOPICIZATION_LLM_MODEL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      # F5-C Evolving Topic Summaries — scheduler singleton reads OS env at
      # startup (pydantic priority over bind-mounted .env); mirror LLM vars.
      - RESUMMARIZE_ENABLED=${RESUMMARIZE_ENABLED:-true}
      - RESUMMARIZE_TRIGGER_N=${RESUMMARIZE_TRIGGER_N:-5}
      - RESUMMARIZE_MAX_AGE_DAYS=${RESUMMARIZE_MAX_AGE_DAYS:-0}
      - RESUMMARIZE_MAX_PER_TICK=${RESUMMARIZE_MAX_PER_TICK:-10}
      # ADR-0018 topic_card_versions retention. Mirroring is not defence-in-depth
      # here, it is the ONLY way these ever reach the app: the entrypoint runs the
      # installed copy from /opt/venv, whose _ENV_FILE resolves to a path that does
      # not exist, so the bind-mounted /app/.env is never read and an unmirrored
      # setting is pinned to its code default (BUG-092 — this is the sharper form
      # of the "OS-env priority" wording in BUG-078). The stake is higher than for
      # the knobs above because purge_stale_topic_card_versions() hard-DELETEs:
      # an operator raising KEEP_LAST_N to keep MORE history would leave the
      # worker on the default and delete more than intended, irreversibly.
      # Defaults below equal the code defaults (0 = purge-disabled kill-switch,
      # 50 = recent-floor), so mirroring changes nothing until .env sets them.
      - RESUMMARIZE_VERSION_RETENTION_DAYS=${RESUMMARIZE_VERSION_RETENTION_DAYS:-0}
      - RESUMMARIZE_VERSION_KEEP_LAST_N=${RESUMMARIZE_VERSION_KEEP_LAST_N:-50}
      # BUG-076/077/078 checkpointed full topicization — same OS-env-priority
      # gotcha as RESUMMARIZE_* above: the scheduler singleton reads OS env at
      # startup, so these MUST be mirrored here or the bind-mounted .env value is
      # ignored and the worker falls back to code defaults (the BUG-078 false-green).
      - TOPICIZATION_FULL_RESUME_ENABLED=${TOPICIZATION_FULL_RESUME_ENABLED:-false}
      - TOPICIZATION_FULL_CHUNK_BATCHES=${TOPICIZATION_FULL_CHUNK_BATCHES:-20}
      - TOPICIZATION_FULL_MAX_CHUNKS_PER_INVOCATION=${TOPICIZATION_FULL_MAX_CHUNKS_PER_INVOCATION:-1}
      - TOPICIZATION_FULL_RUN_TOKEN_BUDGET=${TOPICIZATION_FULL_RUN_TOKEN_BUDGET:-0}
      - TOPICIZATION_FULL_MERGE_THRESHOLD=${TOPICIZATION_FULL_MERGE_THRESHOLD:-0.6}
      - TOPICIZATION_FULL_RESUME_NOPROGRESS_LIMIT=${TOPICIZATION_FULL_RESUME_NOPROGRESS_LIMIT:-3}
      - TOPICIZATION_FULL_RESUME_NOPROGRESS_COOLDOWN_S=${TOPICIZATION_FULL_RESUME_NOPROGRESS_COOLDOWN_S:-3600}
      # BUG-079: network-stall hardening knobs — same OS-env-priority gotcha as
      # TOPICIZATION_FULL_* / RESUMMARIZE_* above (BUG-078): MUST be mirrored here
      # or the bind-mounted .env value is ignored and the worker uses code defaults.
      - TOPICIZATION_BATCH_CONCURRENCY=${TOPICIZATION_BATCH_CONCURRENCY:-5}
      - TOPICIZATION_BATCH_SIZE=${TOPICIZATION_BATCH_SIZE:-50}
      - ANTHROPIC_HTTP_TIMEOUT_S=${ANTHROPIC_HTTP_TIMEOUT_S:-150}
      - ANTHROPIC_CALL_TIMEOUT_S=${ANTHROPIC_CALL_TIMEOUT_S:-420}
      # BUG-080: opt-in streaming (stream=true) for the Anthropic Messages API —
      # same OS-env-priority gotcha (BUG-078): MUST be mirrored here or the
      # bind-mounted .env value is ignored and the worker uses the code default.
      - ANTHROPIC_STREAMING_ENABLED=${ANTHROPIC_STREAMING_ENABLED:-false}
      # BUG-080 §2.6: tight inter-EVENT read timeout used ONLY on the streaming
      # path (decoupled from the flag above; non-streaming keeps
      # ANTHROPIC_HTTP_TIMEOUT_S=150). Same BUG-078 mirror requirement.
      - ANTHROPIC_STREAMING_READ_TIMEOUT_S=${ANTHROPIC_STREAMING_READ_TIMEOUT_S:-30}
      # Prompts (BUG-028 Layer D): explicit PROMPTS_DIR override pins the
      # PromptLoader path inside the container, defense-in-depth for any
      # call-site that bypasses Layers A/B/C. Default matches the
      # `./prompts:/app/prompts:ro` bind mount above.
      - PROMPTS_DIR=${PROMPTS_DIR:-/app/prompts}
      # Telegram
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_PHONE=${TELEGRAM_PHONE}
      - TELEGRAM_SESSION_NAME=${TELEGRAM_SESSION_NAME:-/app/sessions/tg_parser_session}
      # F9 Phase-3 session-at-rest key. Same OS-env-priority gotcha as the
      # RESUMMARIZE_*/TOPICIZATION_FULL_* vars above (BUG-078): the scheduler
      # singleton reads OS env at startup, so if this is not mirrored here the
      # bind-mounted .env value is ignored and `unseal_session_for_use` sees
      # None → SessionCryptoError on every incremental tick (encrypted session
      # present but key unset). MUST be listed explicitly for the scheduler.
      - TELEGRAM_SESSION_KEY=${TELEGRAM_SESSION_KEY:-}
      # Scheduler poll interval (seconds). Same BUG-078 OS-env-priority gotcha:
      # the scheduler singleton reads this at startup. Default 3600; the B1
      # IncrementalIngestionAllSourcesFailing alert window ([2h]) assumes a
      # 1h tick, so a prod .env override MUST reach the worker or the alert
      # math silently drifts. Also gated by tests/test_compose_env_propagation.py
      # SCHEDULER_CRITICAL_ENV (B2 / BUG-085).
      - SCHEDULER_DEFAULT_INTERVAL=${SCHEDULER_DEFAULT_INTERVAL:-3600}
      # Security
      - API_KEY_REQUIRED=${API_KEY_REQUIRED:-false}
      - API_KEYS=${API_KEYS:-{}}
      - MCP_AUTH_ENABLED=${MCP_AUTH_ENABLED:-false}
      - MCP_AUTH_TOKENS=${MCP_AUTH_TOKENS:-{}}
      - BOT_ALLOWED_USERS=${BOT_ALLOWED_USERS:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-["*"]}
      # Logging
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    # Default CMD from Dockerfile: api --host 0.0.0.0 --port 8000
    # Override for one-shot commands: docker compose run tg_parser <command>
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    restart: unless-stopped
    networks:
      - tg_parser_network

  # MCP Server (Streamable HTTP for AI agents)
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: tg_parser:latest
    container_name: tg_parser_mcp
    depends_on:
      postgres:
        condition: service_healthy
    # BUG-016 (extended scope 2026-05-16): load TELEGRAM_API_ID/HASH/PHONE
    # + every other secret from .env into the process environment so the
    # in-process pipeline path (`mcp_server.py:_run_pipeline_background`
    # → `run_full_pipeline` → `TelethonClient.__init__`) does not raise
    # `ValueError: Missing TELEGRAM_API_ID/HASH`.
    #
    # The `./.env:/app/.env:ro` bind mount that used to sit below was REMOVED
    # 2026-08-11. It was kept as "harmless redundancy — pydantic-settings can
    # read it if `env_file` is ever removed", and that justification was simply
    # false: the entrypoint runs the installed copy from /opt/venv, so the
    # env_file path pydantic derives from __file__ points into site-packages and
    # the mount was never readable by the app at all (BUG-092). A mount that
    # advertises a fallback it cannot provide is worse than no mount, so it is
    # gone rather than re-explained. env_file below is the real mechanism.
    #
    # The companion `tg_parser` service explicitly lists each
    # env var; here we use `env_file` to avoid duplicating the full list.
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./prompts:/app/prompts:ro
      # BUG-016 (extended scope 2026-05-16): persisted Telethon session
      # (mirror `tg_parser` service line ~45 — bind mount, not named
      # volume — so the session file is shared across all three
      # Telethon-instantiating services without re-auth).
      - ./data/sessions:/app/sessions
    ports:
      - "127.0.0.1:${MCP_PORT:-8080}:8080"
    environment:
      # Database — see tg_parser service for rationale (DB_HOST hardcoded).
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-tg_parser}
      - DB_USER=${DB_USER:-tg_parser_user}
      - DB_PASSWORD=${DB_PASSWORD:?Database password required}
      # LLM — full key trio + per-stage routing so RAG (ask_question) can
      # reach providers other than the default LLM_PROVIDER (DI-17).
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-}
      - RAG_LLM_PROVIDER=${RAG_LLM_PROVIDER:-}
      - RAG_LLM_MODEL=${RAG_LLM_MODEL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # Embedding (search_knowledge_base / ask_question)
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openai}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      # Prompts (BUG-028 Layer D): see tg_parser service for rationale.
      - PROMPTS_DIR=${PROMPTS_DIR:-/app/prompts}
      # MCP
      - MCP_TRANSPORT=streamable-http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8080
      - MCP_AUTH_ENABLED=${MCP_AUTH_ENABLED:-false}
      - MCP_AUTH_TOKENS=${MCP_AUTH_TOKENS:-{}}
      # Logging
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    command: ["mcp", "--transport", "streamable-http"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - tg_parser_network

  # Telegram Bot (Phase 3 — Gemini agent)
  tg_bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: tg_parser:latest
    container_name: tg_parser_bot
    depends_on:
      postgres:
        condition: service_healthy
    # BUG-016 (extended scope 2026-05-16): same defect as `mcp` — bot
    # exposes `trigger_pipeline` as a bot tool (`tg_parser/bot/tools.py`
    # lines 54, 266, 2846) which runs `_run_pipeline_background`
    # (`bot/tools.py:1373`) → `run_full_pipeline` → Telethon. Without
    # `TELEGRAM_API_ID/HASH/PHONE/SESSION_NAME`, `TelethonClient.__init__`
    # raises `ValueError` and the catch-all in `_run_pipeline_background`
    # silently swallows it. `env_file` here mirrors the `mcp` fix above.
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./prompts:/app/prompts:ro
      # BUG-016 (extended scope 2026-05-16): persisted Telethon session
      # (mirror `tg_parser` and `mcp` services — same bind mount path so
      # all three Telethon-instantiating containers share one session
      # file and avoid re-authenticating).
      - ./data/sessions:/app/sessions
    environment:
      # Database — see tg_parser service for rationale (DB_HOST hardcoded).
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-tg_parser}
      - DB_USER=${DB_USER:-tg_parser_user}
      - DB_PASSWORD=${DB_PASSWORD:?Database password required}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-3}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-5}
      # LLM — all three API keys (Gemini for agent, Anthropic for RAG if configured, OpenAI for embeddings)
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-}
      - PROCESSING_LLM_PROVIDER=${PROCESSING_LLM_PROVIDER:-}
      - PROCESSING_LLM_MODEL=${PROCESSING_LLM_MODEL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # Embedding (for search/RAG — uses OpenAI embeddings by default)
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openai}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      # Prompts (BUG-028 Layer D): explicit PROMPTS_DIR override pins the
      # PromptLoader path inside the container for the daily digest cron
      # (run_scheduled_digests_task → PromptLoader → load 'digest'/'processing').
      # Defense-in-depth on top of Layers A/B/C; default matches the
      # `./prompts:/app/prompts:ro` bind mount above. This was previously
      # the prod hotfix workaround (applied 2026-05-23T09:49:15Z to
      # tg_parser_bot ad-hoc) — now committed for all three services.
      - PROMPTS_DIR=${PROMPTS_DIR:-/app/prompts}
      # Bot configuration
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - BOT_ALLOWED_USERS=${BOT_ALLOWED_USERS:-}
      - BOT_REQUEST_TIMEOUT=${BOT_REQUEST_TIMEOUT:-60}
      - BOT_RATE_LIMIT=${BOT_RATE_LIMIT:-10}
      - BOT_GEMINI_MODEL=${BOT_GEMINI_MODEL:-gemini-2.5-flash}
      # Logging
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    command: ["bot"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    stop_grace_period: 15s
    restart: unless-stopped
    networks:
      - tg_parser_network
    profiles:
      - bot

  # Caddy Reverse Proxy + TLS
  caddy:
    image: caddy:2-alpine
    container_name: tg_parser_caddy
    depends_on:
      tg_parser:
        condition: service_healthy
      mcp:
        condition: service_healthy
      grafana:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      - DOMAIN_MCP=${DOMAIN_MCP:-mcp.localhost}
      - DOMAIN_API=${DOMAIN_API:-api.localhost}
      - DOMAIN_GRAFANA=${DOMAIN_GRAFANA:-grafana.localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - tg_parser_network
    profiles:
      - production

  # Prometheus monitoring
  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: tg_parser_prometheus
    volumes:
      # BUG-090: mount the DIRECTORY, never the individual files. A single-file
      # bind mount resolves to that file's inode at container-create time, and
      # git replaces files by rename() rather than editing in place — so after a
      # `git pull` the container kept serving the OLD config forever, and even a
      # hot `/-/reload` reported success while nothing had changed. With the
      # directory mounted, a replaced file is visible immediately and `/-/reload`
      # actually reloads it.
      - ./docker/prometheus:/etc/prometheus/conf:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/conf/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    restart: unless-stopped
    networks:
      - tg_parser_network

  # Grafana dashboards
  grafana:
    image: grafana/grafana:13.1.1
    container_name: tg_parser_grafana
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      # BUG-036: secrets for the provisioned cursor-watch-webhook contact point
      # (docker/grafana/provisioning/alerting/wave1_step4.yaml). Values live in
      # the gitignored .env; never commit them. Grafana expands these at
      # provisioning load time.
      # Empty defaults crash Grafana provisioning (invalid webhook url). Loopback
      # no-op lets the container start; set real values in gitignored .env for prod.
      - GRAFANA_WEBHOOK_URL=${GRAFANA_WEBHOOK_URL:-http://127.0.0.1:65535/}
      - GRAFANA_WEBHOOK_TOKEN=${GRAFANA_WEBHOOK_TOKEN:-unset}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped
    networks:
      - tg_parser_network

  # Optional: Ollama service for local LLM
  ollama:
    image: ollama/ollama:latest
    container_name: tg_parser_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - tg_parser_network
    profiles:
      - ollama
    # Uncomment to enable GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  postgres_data:
    external: true
    name: tg_parser_pgvector17_data
  ollama_data:
    name: tg_parser_ollama_data
  caddy_data:
    name: tg_parser_caddy_data
  caddy_config:
    name: tg_parser_caddy_config
  prometheus_data:
    name: tg_parser_prometheus_data
  grafana_data:
    name: tg_parser_grafana_data

networks:
  tg_parser_network:
    name: tg_parser_network
    driver: bridge
