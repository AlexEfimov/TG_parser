[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tg_parser"
version = "4.3.0"
description = "Telegram message parser for knowledge base extraction"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0",
    "jsonschema>=4.0",
    "httpx>=0.27",
    "typer>=0.12",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "pgvector>=0.3.0",
    "telethon>=1.36",
    "structlog>=24.0",
    # HTTP API (v2.0)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "slowapi>=0.1.9",
    # Agents SDK
    "openai-agents>=0.6",
    # Configuration
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    # Observability
    "prometheus-fastapi-instrumentator>=7.0",
    "apscheduler>=3.10",
    # MCP Server (P6b)
    "mcp>=1.25",
    # Telegram Bot (Phase 3)
    "aiogram>=3.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    # Ephemeral pgvector containers for migration smoke / parity tests
    # (DI-9 phase 2). Opt-in via TEST_TESTCONTAINERS=1; requires Docker.
    "testcontainers[postgres]>=4.8",
    "ruff==0.15.11",
]

[project.scripts]
tg-parser = "tg_parser.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["tg_parser*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = [
    "integration: tests that require external services (OpenAI API, network)",
]

[tool.coverage.run]
source = ["tg_parser"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by formatter
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
