[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tg_parser"
version = "4.3.0"
description = "Telegram message parser for knowledge base extraction"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "jsonschema>=4.0,<5",
    "httpx>=0.27,<0.29",
    "typer>=0.12,<1.0",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.29,<0.32",
    "psycopg2-binary>=2.9,<3.0",
    "alembic>=1.13,<2.0",
    "pgvector>=0.3.0,<0.5",
    "telethon>=1.36,<2.0",
    "structlog>=24.0,<27",
    # HTTP API (v2.0)
    # fastapi cap (<0.137) is Phase 1 — keep until a post-8.0.0
    # prometheus-fastapi-instrumentator supports fastapi 0.137 _IncludedRouter.
    "fastapi>=0.136,<0.137",
    "uvicorn[standard]>=0.32,<0.50",
    "slowapi>=0.1.9,<0.2",
    # Agents SDK
    "openai-agents>=0.13,<0.18",
    # Configuration
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.0,<2",
    # Observability
    # prometheus-fastapi-instrumentator intentionally NOT capped: 8.0.0 is
    # confirmed-good and pinned exactly by uv.lock (transitive starlette too).
    "prometheus-fastapi-instrumentator>=7.0",
    "apscheduler>=3.10,<4.0",
    # MCP Server (P6b)
    "mcp>=1.25,<2.0",
    # Telegram Bot (Phase 3)
    "aiogram>=3.15,<4.0",
    # F11 watchlist keyword normalization (script-routed lemmatization)
    "pymorphy3>=2.0,<3",
    "pymorphy3-dicts-ru>=2.4",
    "simplemma>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-asyncio>=0.23,<2",
    "pytest-cov>=4.0,<8",
    # Ephemeral pgvector containers for migration smoke / parity tests
    # (DI-9 phase 2). Opt-in via TEST_TESTCONTAINERS=1; requires Docker.
    "testcontainers[postgres]>=4.8,<5",
    "ruff==0.15.11",
]

[project.scripts]
tg-parser = "tg_parser.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["tg_parser*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = [
    "integration: tests that require external services (OpenAI API, network)",
    "compose_only: integration tests that require a running docker-compose stack (BUG-059)",
]

[tool.coverage.run]
source = ["tg_parser"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by formatter
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
